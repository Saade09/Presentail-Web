    HomepageCollectionItem:
      type: object
      description: |
        A single item shown in a homepage circular-card carousel. The shape
        is intentionally generic so it can back both the "Categories" and
        "Occasions" rows, and a future DB-backed implementation without a
        breaking change.
      properties:
        id:
          type: string
          description: Stable identifier (typically the WooCommerce category id as a string).
        name:
          type: string
          description: Display label rendered under the circular image.
        slug:
          type: string
          description: URL-safe slug used to build the destination link.
        imageUrl:
          type: string
          description: Absolute URL of the image rendered inside the circular card. Empty string when no image is configured.
        sortOrder:
          type: integer
          description: Lower values appear first in the carousel.
        isActive:
          type: boolean
          description: Whether this item should be rendered. Inactive items are filtered out server-side but the field is exposed for clients that want to show admin previews.
      required:
        - id
        - name
        - slug
        - imageUrl
        - sortOrder
        - isActive
    HomepageCollectionResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HomepageCollectionItem"
      required:
        - items
    DeliveryConfigResponse:
      type: object
      properties:
        expressDeliveryTimeLabel:
          type: string
          description: Human-readable express delivery promise (e.g. "Arrives in 90 minutes").
        freeDeliveryThreshold:
          type: string
          description: Localized free-delivery threshold copy (e.g. "AED 480").
        currency:
          type: string
          description: ISO 4217 currency code that the threshold is denominated in.
        freeDeliveryThresholdUsd:
          type: number
          description: Free-delivery threshold in USD (the cart's internal currency). Use for fee calculation at checkout.
        freeDeliveryEnabled:
          type: boolean
          description: Whether free delivery is offered for this country. When false, delivery fees are always applied regardless of cart total.
      required:
        - expressDeliveryTimeLabel
        - freeDeliveryThreshold
        - currency
    GeoCurrencyResponse:
