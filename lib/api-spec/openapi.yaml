    HomepageCollectionItem:
      type: object
      description: |
        A single item shown in a homepage circular-card carousel. The shape
        is intentionally generic so it can back both the "Categories" and
        "Occasions" rows, and a future DB-backed implementation without a
        breaking change.
      properties:
        id:
          type: string
          description: Stable identifier (typically the WooCommerce category id as a string).
        name:
          type: string
          description: Display label rendered under the circular image.
        slug:
          type: string
          description: URL-safe slug used to build the destination link.
        imageUrl:
          type: string
          description: Absolute URL of the image rendered inside the circular card. Empty string when no image is configured.
        sortOrder:
          type: integer
          description: Lower values appear first in the carousel.
        isActive:
          type: boolean
          description: Whether this item should be rendered. Inactive items are filtered out server-side but the field is exposed for clients that want to show admin previews.
        _rankingDebug:
          type: object
          nullable: true
          description: |
            Present only when the request includes `?debug=1` with a valid
            `x-push-admin-token` header. Contains per-item scoring breakdown
            for the smart-ranking engine.
          properties:
            performanceScore:
              type: number
              description: Bayesian-smoothed sales performance score in [0, 1).
            seasonalBoost:
              type: number
              description: Additive boost from active seasonal windows.
            manualBoost:
              type: number
              description: Operator-configured additive boost from the DB config.
            availabilityPenalty:
              type: number
              description: Penalty subtracted when in-stock product count is below the floor.
            finalScore:
              type: number
              description: performanceScore + seasonalBoost + manualBoost − availabilityPenalty.
            productCount:
              type: integer
              description: Number of in-stock OS products tagged with this slug.
          required:
            - performanceScore
            - seasonalBoost
            - manualBoost
            - availabilityPenalty
            - finalScore
            - productCount
      required:
        - id
        - name
        - slug
        - imageUrl
        - sortOrder
        - isActive
