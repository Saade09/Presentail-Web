openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: checkout
    description: Checkout payment operations
  - name: health
    description: Health operations
  - name: push
    description: Push notification operations
  - name: deliveryLocations
    description: Supported delivery countries and cities
  - name: homepage
    description: Homepage feed content (banners, etc.)
  - name: deliveryConfig
    description: Per-city express delivery time and free-delivery threshold copy
  - name: geo
    description: IP-based geolocation helpers (display currency hints)
  - name: clientErrors
    description: Client-side crash reports from mobile and web clients
  - name: analytics
    description: Lightweight client-side product analytics events
  - name: auth
    description: Account profile operations for the signed-in customer
  - name: meAddresses
    description: Saved delivery addresses owned by the signed-in customer
  - name: coupons
    description: OS-backed promo code validation and listing
  - name: loyalty
    description: Loyalty points and tier coupons for the signed-in customer
  - name: favorites
    description: Saved favorite products for the signed-in customer
  - name: partner
    description: Partner application submission
  - name: occasions
    description: Saved occasions (birthdays, anniversaries, etc.) for the signed-in customer
  - name: referral
    description: Referral code for the signed-in customer
  - name: fbEvents
    description: Server-side Facebook Conversions API events from mobile
  - name: products
    description: Product utilities (color inference, etc.)
  - name: categories
    description: Category-level product classification endpoints
  - name: orders
    description: Order ID generation
  - name: seo
    description: SEO audit and quality monitoring endpoints
paths:
  /seo/audit/latest:
    get:
      operationId: getSeoAuditLatest
      tags: [seo]
      summary: Get latest SEO audit run
      description: Returns the most recent seo_audit_runs row with full check results. Requires admin token.
      parameters:
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest audit run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoAuditLatestResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No audit run found yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /seo/audit/run:
    post:
      operationId: triggerSeoAuditRun
      tags: [seo]
      summary: Trigger a new SEO audit run
      description: Starts a full SEO audit asynchronously and returns immediately. Requires admin token.
      parameters:
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Audit started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoAuditRunResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /seo/audit/run/{id}:
    get:
      operationId: getSeoAuditRunById
      tags: [seo]
      summary: Get a specific SEO audit run by ID
      description: Returns a specific audit run row including full summaryJson. Requires admin token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit run found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoAuditRunByIdResponse"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Audit run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /seo/audit/history:
    get:
      operationId: getSeoAuditHistory
      tags: [seo]
      summary: Get SEO audit run history
      description: Returns the last 10 audit run summaries (without full check details). Requires admin token.
      parameters:
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoAuditHistoryResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /img/proxy:
    get:
      operationId: proxyOsImage
      tags: [products]
      summary: Fetch and convert an OS storage image to WebP at a requested width
      description: |
        Fetches an image from Presentail OS storage (`os.presentail.com/api/storage/`),
        resizes it to the requested pixel width, and returns it as WebP (or JPEG).
        Results are cached server-side in an LRU cache and returned with a
        one-year immutable `Cache-Control` header so repeat requests are served
        instantly by the browser and any CDN in front of the API.

        Only URLs whose host is `os.presentail.com` and whose path begins with
        `/api/storage/` are accepted — all other origins are rejected with 400
        to prevent SSRF. No authentication required; product images are public.
      parameters:
        - name: url
          in: query
          required: true
          description: Fully-qualified `https://os.presentail.com/api/storage/` image URL.
          schema:
            type: string
        - name: w
          in: query
          required: false
          description: |
            Target pixel width. The image is resized to this width while preserving
            aspect ratio. Clamped to a maximum of 1600. Defaults to 800 when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 1600
        - name: f
          in: query
          required: false
          description: Output format. Defaults to `webp`.
          schema:
            type: string
            enum: [webp, jpeg]
      responses:
        "200":
          description: Converted image
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Missing, invalid, or disallowed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream OS fetch failed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /push/register:
    post:
      operationId: registerPushToken
      tags: [push]
      summary: Register a device push token
      description: |
        Register an Expo push token (or APNs/FCM token in production) for the
        current device. When the request is authenticated, the token is
        associated with the signed-in user; otherwise it is associated only
        with the supplied deviceId so guest devices can still receive pushes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterRequest"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegisterResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/unregister:
    post:
      operationId: unregisterPushToken
      tags: [push]
      summary: Unregister a device push token
      description: |
        Remove a previously-registered push token. Either token or deviceId
        must be provided. Called on sign-out, account deletion, or when the
        device permission is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnregisterRequest"
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushUnregisterResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/order-event:
    post:
      operationId: sendOrderEventPush
      tags: [push]
      summary: Trigger an order-event push notification (admin)
      description: |
        Looks up the registered tokens for the recipient of the given order
        and sends an order-state push (confirmed, out-for-delivery,
        delivered). Requires the X-Push-Admin-Token header to match
        PUSH_ADMIN_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushOrderEventRequest"
      responses:
        "200":
          description: Pushes sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOrderEventResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client-errors:
    post:
      operationId: reportClientError
      tags: [clientErrors]
      summary: Report a client-side crash
      description: |
        Accepts a single crash report from a mobile or web client. Used by the
        per-screen and root error boundaries to surface real crashes in the
        server logs (and any downstream log sink) instead of leaving them only
        in the device console. Bodies are intentionally bounded; messages and
        stacks longer than the hard limit are truncated server-side. PII
        scrubbing is the client's responsibility, but the server also drops
        obviously sensitive substrings (bearer tokens, JWTs, emails, phone
        numbers) defensively before logging. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReportRequest"
      responses:
        "200":
          description: Report acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorReportResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fb/events:
    post:
      operationId: recordFbMobileEvent
      tags: [fbEvents]
      summary: Forward a Facebook CAPI event from the mobile app
      description: |
        Accepts a single standard Facebook Pixel event fired from the mobile app
        and forwards it to the Facebook Conversions API server-side. No auth
        required — pixel IDs and access tokens remain server-side. Cyprus
        (countryCode="CY") and any country without a configured pixel are silently
        skipped. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FbMobileEventRequest"
      responses:
        "200":
          description: Event accepted (or silently skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbMobileEventResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pixel/event:
    post:
      operationId: recordFbWebEvent
      tags: [fbEvents]
      summary: Forward a Facebook CAPI event from the web app
      description: |
        Accepts a single standard Facebook Pixel event fired from the web storefront
        and forwards it to the Facebook Conversions API server-side. No auth
        required — access tokens remain server-side. The client supplies the pixel ID
        (a non-secret identifier already present in the browser env) and an optional
        fbp cookie value for deduplication. Unknown pixel IDs and any country without
        a configured access token are silently skipped. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FbWebEventRequest"
      responses:
        "200":
          description: Event accepted (or silently skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbWebEventResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories/stuffed-animals/sizes:
    get:
      operationId: getStuffedAnimalsSizes
      tags: [categories]
      summary: Get AI-inferred size classifications for stuffed-animals products
      description: |
        Returns a map of product ID → size bucket (small | medium | life-size)
        for all products in the stuffed-animals category. Size is inferred from
        the product name using keyword heuristics (mini/baby/small → small;
        giant/life-size/large → life-size; everything else → medium) with an
        LLM fallback for ambiguous names. Results are cached in-process for
        24 hours — no extra round-trips on page load. Returns 503 when the OS
        product cache has not yet been populated.
      responses:
        "200":
          description: Size map for all stuffed-animals products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuffedAnimalsSizesResponse"
        "503":
          description: Product catalog not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /catalog/plant-classifications:
    get:
      operationId: getPlantClassifications
      tags: [catalog]
      summary: Get AI-inferred indoor/outdoor classifications for plant products
      description: |
        Returns a map of OS product ID → environment classification ("indoor" | "outdoor")
        for all classified plant products. Products not yet classified are omitted from
        the map — the frontend treats missing entries as "indoor pending" and shows them
        under the Indoor Plants section until classification completes. No auth required.
      responses:
        "200":
          description: Plant classification map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantClassificationsResponse"
        "500":
          description: Database query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/plant-classifications:
    get:
      operationId: listPlantClassifications
      x-admin: true
      tags: [catalog]
      summary: List all plant product classifications (admin)
      description: |
        Returns every row in the `plant_environment_cache` table, including source,
        needs_review flag, and content hash. Protected by the `x-push-admin-token` header.
      parameters:
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All plant classification rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlantClassificationsListResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/plant-classifications/{osProductId}:
    patch:
      operationId: overridePlantClassification
      x-admin: true
      tags: [catalog]
      summary: Override the indoor/outdoor classification for a single plant product (admin)
      description: |
        Manually sets the environment classification for a single product. Sets
        `source = "admin"` and clears `needs_review`. Protected by the
        `x-push-admin-token` header.
      parameters:
        - name: osProductId
          in: path
          required: true
          schema:
            type: string
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantClassificationOverrideRequest"
      responses:
        "200":
          description: Updated classification row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantClassificationOverrideResponse"
        "400":
          description: Invalid classification value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product classification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/plant-classifications/{osProductId}/reclassify:
    post:
      operationId: reclassifyPlantProduct
      x-admin: true
      tags: [catalog]
      summary: Re-run AI classification for a single plant product (admin)
      description: |
        Wipes the stored classification and re-runs AI inference for the given
        product. Protected by the `x-push-admin-token` header.
      parameters:
        - name: osProductId
          in: path
          required: true
          schema:
            type: string
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reclassification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantReclassifyResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found in plants catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: OS product cache not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/plant-classifications/bulk-reclassify:
    post:
      operationId: bulkReclassifyPlants
      x-admin: true
      tags: [catalog]
      summary: Bulk re-run AI classification for all plant products (admin)
      description: |
        Wipes all stored classifications (or only non-admin overrides when
        `?keepManual=true`) and re-runs AI inference for all plant products.
        Protected by the `x-push-admin-token` header.
      parameters:
        - name: keepManual
          in: query
          required: false
          schema:
            type: boolean
          description: When true, preserves admin-overridden classifications and only reclassifies AI/fallback rows.
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bulk reclassification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantBulkReclassifyResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: OS product cache not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /occasions/new-born/gender:
    get:
      operationId: getNewbornGender
      tags: [occasions]
      summary: Get AI-inferred gender classifications for new-born occasion products
      description: |
        Returns a map of product ID → gender bucket (boy | girl | neutral)
        for all products in the new-born occasion. Gender is inferred from
        keyword heuristics first (blue/navy/boy → "boy"; pink/rose/girl → "girl";
        everything else → "neutral") with an LLM fallback for ambiguous names.
        Results are cached in-process for 24 hours. Returns 503 when the OS
        product cache has not yet been populated.
      responses:
        "200":
          description: Gender map for all new-born occasion products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewbornGenderResponse"
        "503":
          description: Product catalog not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/frequently-bought-together:
    get:
      operationId: getFrequentlyBoughtTogether
      tags: [products]
      summary: Get frequently bought together products for a PDP
      description: |
        Returns up to 4 in-stock products that are most frequently co-purchased
        with the given anchor product slug, derived from real co-purchase data
        in `app_orders`. Only applies to products in the `flowers` or `cakes`
        categories; returns an empty array for all other categories so
        non-targeted PDPs are unaffected.

        Cold-start behaviour: when fewer than 2 affinity matches exist, the
        gap is filled with top-selling in-stock products from the same category
        so the section is never empty once the catalog is populated.

        Returns 503 when the OS product cache has not yet been populated.
      parameters:
        - name: slug
          in: query
          required: true
          description: OS product slug of the anchor product.
          schema:
            type: string
        - name: store
          in: query
          required: false
          description: |
            Store key used to resolve live product data and stock status.
            Defaults to `lebanon`.
          schema:
            type: string
            enum: [lebanon, dubai, abudhabi, cyprus]
      responses:
        "200":
          description: Frequently bought together products (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrequentlyBoughtTogetherResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Product catalog not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products/color-hints:
    post:
      operationId: getProductColorHints
      tags: [products]
      summary: Get AI-inferred color hints for a list of products
      description: |
        Accepts a list of product slugs and names. Returns a map of slug →
        color keyword (one of the 17 known colors) or null for products where
        no color can be confidently inferred. Results are cached by name hash
        so the LLM is only called once per new or renamed product. No auth
        required. Call this only for products that did not match any keyword
        on the client side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductColorHintsRequest"
      responses:
        "200":
          description: Color hints for each requested slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductColorHintsResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analytics/events:
    post:
      operationId: recordAnalyticsEvent
      tags: [analytics]
      summary: Record a client-side analytics event
      description: |
        Accepts a single lightweight product-analytics event from a web or
        mobile client (for example, which button a shopper picked on the
        checkout login prompt). Events are bounded, validated against an
        allowlist of known event names, and forwarded to the server log
        sink that downstream BI/dashboards already consume — there is no
        separate analytics destination configured today. Rate-limited per
        IP. The server never trusts client-supplied user identifiers; the
        signed-in user (if any) is read from the session cookie instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventRequest"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /web-events:
    post:
      operationId: recordWebEvents
      tags: [analytics]
      summary: Ingest cart and checkout funnel events from the web storefront
      description: |
        Accepts a single web funnel event or a batch of up to 500 events from
        the web storefront. Authenticated by `x-api-key` (the Presentail OS API
        key — same key the storefront already holds). Events without a
        `sessionId` are silently dropped. Stored in the existing
        `analytics_events` table so the funnel monitors pick them up
        automatically. Rate-limited per IP (120 req / 5 min). DB writes are
        best-effort — a transient DB hiccup never returns a 5xx.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWebEventsBody"
      responses:
        "200":
          description: Events accepted (or silently dropped for missing sessionId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostWebEventsResponse"
        "401":
          description: Missing or invalid x-api-key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unknown event type or invalid body shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /homepage/banners:
    get:
      operationId: getHomepageBanners
      tags: [homepage]
      summary: Get active homepage hero banners
      description: |
        Returns the active homepage hero banner carousel for the supplied
        country, city, and device. All filtering (active status, schedule
        window, country/city targeting) is handled server-side by Presentail
        OS. Results are sorted by sortOrder ascending then priority ascending.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 country code (case-insensitive) used to filter
            country-targeted banners.
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: |
            Optional city identifier (e.g. "ae-dubai") used to filter
            city-targeted banners.
          schema:
            type: string
        - name: device
          in: query
          required: true
          description: |
            The requesting device type. OS uses this to return the correct
            media asset dimensions and crop for the viewport.
          schema:
            type: string
            enum: [desktop, mobile]
        - name: lang
          in: query
          required: false
          description: |
            Language for banner text fields (title, headline, subtitle,
            ctaText). When the OS response contains a localised variant
            (flat fields such as title_ar / title_fr, or a nested
            translations.{lang}.* shape) that value is returned instead
            of the English original. Falls back to English when the
            localised field is absent or empty. Defaults to "en" when
            omitted.
          schema:
            type: string
            enum: [en, ar, fr, el]
            default: en
      responses:
        "200":
          description: Active banners for the country/city/device/lang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageBannersResponse"
  /homepage/categories:
    get:
      operationId: getHomepageCategories
      tags: [homepage]
      summary: Get curated homepage Categories carousel items
      description: |
        Returns the curated list of items for the homepage "Categories"
        carousel. The list is sourced from WooCommerce product categories
        whose parent has slug `home-categories`, mapped into the shared
        `HomepageCollectionItem` shape, sorted by `sortOrder` ascending.
        If WooCommerce credentials are unset or the parent category does
        not yet exist in WP admin, a sensible hand-rolled default set is
        returned so the homepage is never blank during admin setup. On a
        WooCommerce network/HTTP failure the endpoint instead returns an
        empty `items` array (still 200) so the client hides the section
        rather than rendering stale defaults.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 country code (case-insensitive) used to
            resolve which WooCommerce store the categories are sourced
            from. When omitted, the server falls back to Lebanon.
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: |
            City identifier (e.g. "ae-dubai", "ae-abu-dhabi") used to
            resolve a city-specific WooCommerce store when the country
            alone is ambiguous.
          schema:
            type: string
      responses:
        "200":
          description: Categories carousel items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageCollectionResponse"
  /homepage/occasions:
    get:
      operationId: getHomepageOccasions
      tags: [homepage]
      summary: Get curated homepage Occasions carousel items
      description: |
        Returns the curated list of items for the homepage "Occasions"
        carousel. Items are sorted by a composite score (performance + seasonal
        boost + manual boost - availability penalty) so the most relevant
        occasions appear first. When no scoring data is available the list falls
        back to the DEFAULT_OCCASION_SLUGS order. Append `?debug=1` with the
        `x-push-admin-token` header to receive per-item score breakdowns.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 country code (case-insensitive) used to apply
            country-specific ranking config rows. When omitted, global config
            rows apply.
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: |
            City identifier (e.g. "ae-dubai", "ae-abu-dhabi") used to resolve
            the correct OS product store for availability scoring.
          schema:
            type: string
      responses:
        "200":
          description: Occasions carousel items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageCollectionResponse"
  /admin/collection-ranking:
    get:
      operationId: getCollectionRankingConfig
      x-admin: true
      tags: [homepage]
      summary: List all collection ranking config rows (admin)
      description: |
        Returns every row in the `collection_ranking_config` table. Protected
        by the `x-push-admin-token` header (PUSH_ADMIN_TOKEN env var).
      parameters:
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All ranking config rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRankingConfigListResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/collection-ranking/{kind}/{slug}:
    put:
      operationId: upsertCollectionRankingConfig
      x-admin: true
      tags: [homepage]
      summary: Upsert a collection ranking config row (admin)
      description: |
        Creates or updates the ranking config for a single category or occasion
        slug. Invalidates the in-process ranking cache immediately so the next
        `/homepage/categories` or `/homepage/occasions` request reflects the
        change. Protected by the `x-push-admin-token` header.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [category, occasion]
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: x-push-admin-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionRankingConfigUpsertRequest"
      responses:
        "200":
          description: Upserted row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRankingConfigUpsertResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /homepage/best-sellers:
    get:
      operationId: getHomepageBestSellers
      tags: [homepage]
      summary: Get best-selling products for the homepage carousel
      description: |
        Returns up to 12 in-stock products from the Presentail OS cache,
        sorted descending by `totalSales`. The list is filtered by the
        visitor's `countryCode` and `cityId` so only products deliverable
        to that location are included. Products with no `totalSales` data
        (zero or absent) are ranked equally at the bottom. Returns 503
        when the OS product cache has not yet been populated.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country code (case-insensitive) used to filter products by deliverable country.
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: City identifier (e.g. "ae-dubai") used to filter products by deliverable city.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language code ("en", "ar", or "fr"). Reserved for future localisation.
          schema:
            type: string
      responses:
        "200":
          description: Best-selling products for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageBestSellersResponse"
        "503":
          description: OS product cache not yet populated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /homepage/collection-best-sellers:
    get:
      operationId: getHomepageCollectionBestSellers
      tags: [homepage]
      summary: Get best-selling products for a specific category or occasion
      description: |
        Returns in-stock products belonging to a single category or occasion slug,
        ranked by blended sales score (local order history + OS totalSales).
        Identical product shape to /homepage/best-sellers. Results are cached
        5 minutes per (slug, store, country). Pass exactly one of categorySlug
        or occasionSlug.
      parameters:
        - name: categorySlug
          in: query
          required: false
          description: Category slug to filter by (e.g. "balloons", "flower-boxes").
          schema:
            type: string
        - name: occasionSlug
          in: query
          required: false
          description: Occasion slug to filter by (e.g. "summer", "birthday").
          schema:
            type: string
        - name: countryCode
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country code used to filter deliverable products.
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: City identifier (e.g. "ae-dubai") used to resolve the correct store.
          schema:
            type: string
      responses:
        "200":
          description: Ranked products for the collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageBestSellersResponse"
        "400":
          description: Neither categorySlug nor occasionSlug provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /delivery-config:
    get:
      operationId: getDeliveryConfig
      tags: [deliveryConfig]
      summary: Get delivery copy for a country/city
      description: |
        Returns the express-delivery time label, the free-delivery threshold
        copy and the currency code Presentail uses for the given country and
        (optionally) city. Values are sourced from a server-side config so
        operations can change them without a client release. Falls back to
        the country default when cityId is unknown, and to a global default
        when countryCode is unknown.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country code (case-insensitive).
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: Optional city id from /delivery-locations.
          schema:
            type: string
      responses:
        "200":
          description: Delivery config for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConfigResponse"
  /geo/currency:
    get:
      operationId: getGeoCurrency
      tags: [geo]
      summary: Detect display currency from the caller's IP
      description: |
        Resolves the caller's country from their IP address and maps it to a
        display currency. Used by the storefront and mobile app to seed the
        initial display currency on first visit so visitors see prices in
        their local currency without changing any setting. The endpoint is
        cached in-memory for a short TTL per IP and degrades gracefully to
        `{ countryCode: null, currencyCode: "USD" }` on lookup failure or
        timeout. Currency selection here is display-only and does not change
        which WooCommerce store, payment provider currency, or delivery
        country is used.
      responses:
        "200":
          description: Detected display currency for the caller's IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCurrencyResponse"
  /geo/currency-by-coords:
    get:
      operationId: getGeoCurrencyByCoords
      tags: [geo]
      summary: Detect display currency from device coordinates
      description: |
        Resolves the supplied latitude/longitude (typically from the device's
        coarse foreground location, with the user's permission) to an ISO
        country code and maps it to a display currency. Used by the mobile
        app as the primary currency-detection path so shoppers on a VPN, on
        a foreign SIM while roaming, or behind a carrier CGNAT that
        resolves to the wrong country still see prices in their actual
        local currency. Same response shape as `/geo/currency`. Invalid or
        out-of-range coordinates and any lookup failure degrade gracefully
        to `{ countryCode: null, currencyCode: "USD" }`.
      parameters:
        - name: lat
          in: query
          required: true
          description: WGS84 latitude in decimal degrees, range -90..90.
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          description: WGS84 longitude in decimal degrees, range -180..180.
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Detected display currency for the supplied coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCurrencyResponse"
  /me/addresses:
    get:
      operationId: listMyAddresses
      tags: [meAddresses]
      summary: List the signed-in customer's saved delivery addresses
      description: |
        Returns every saved address that belongs to the authenticated
        customer, sorted with the default address first and then by most
        recently updated. Requires a valid Bearer token (legacy WP/social
        JWT or a Clerk session). Other users' addresses are never returned.
      responses:
        "200":
          description: Saved addresses for the current customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressListResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyAddress
      tags: [meAddresses]
      summary: Save a new delivery address to the customer's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "200":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/addresses/{id}:
    patch:
      operationId: updateMyAddress
      tags: [meAddresses]
      summary: Update one of the customer's saved addresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressPatchInput"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyAddress
      tags: [meAddresses]
      summary: Delete one of the customer's saved addresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Address removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressDeleteResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/addresses/{id}/default:
    post:
      operationId: setMyDefaultAddress
      tags: [meAddresses]
      summary: Mark a saved address as the customer's default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Address marked as default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /delivery-locations:
    get:
      operationId: getDeliveryLocations
      tags: [deliveryLocations]
      summary: List supported delivery countries and cities
      description: |
        Returns the canonical list of countries and cities Presentail can
        deliver to, including their isActive flags, currency, flag emoji
        and display ordering. Consumed by the mobile app on launch so
        toggling a country or city in the backend (no app update
        required) is reflected on the next launch.
      responses:
        "200":
          description: Delivery locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLocationsResponse"
  /currencies:
    get:
      operationId: getCurrencies
      tags: [catalog]
      summary: List supported display currencies and FX metadata
      description: |
        Returns the canonical list of supported display currencies (symbol,
        decimals, formatting hints, base USD rates) and the country → currency
        map used to auto-pick a currency for a visitor. The web storefront
        uses this as the single source of truth — the same list mobile ships.
      responses:
        "200":
          description: Currencies metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrenciesResponse"
  /catalog/occasions:
    get:
      operationId: getCatalogOccasions
      tags: [catalog]
      summary: Featured occasions for the megamenu
      description: |
        Returns occasions that have the "Featured / Mega menu" flag enabled in
        Presentail OS. Used by the web storefront's Occasions megamenu panel.
        Updates in real time within the existing cache/webhook refresh cycle
        (~15 min polling + immediate on `catalog_attributes.changed` webhook).
        Returns an empty `occasions` array when the OS cache has not yet been
        populated or no occasions are flagged as featured.
      responses:
        "200":
          description: Featured occasions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogOccasionsResponse"
  /catalog/metadata:
    get:
      operationId: getCatalogMetadata
      tags: [catalog]
      summary: Catalog metadata (categories, occasions, brands)
      description: |
        Returns the static catalog metadata that mobile bundles offline:
        category and occasion definitions (with localized-friendly slugs,
        icons and asset paths) and the curated brand list. Image fields
        carry an `asset` path (resolved by clients to their local
        `catalog/` tree) or a hosted `uri`.
      responses:
        "200":
          description: Catalog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMetadataResponse"
  /coupons:
    get:
      operationId: getCoupons
      tags: [coupons]
      summary: List available OS-backed coupons
      description: Returns the list of active coupons from Presentail OS. Clients can use this to pre-populate a coupon picker UI.
      responses:
        "200":
          description: Coupon list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  coupons:
                    type: array
                    items:
                      $ref: "#/components/schemas/OsCoupon"
                required:
                  - ok
                  - coupons
        "503":
          description: OS API not configured
  /loyalty/me:
    get:
      operationId: getLoyaltyMe
      tags: [loyalty]
      summary: Get the signed-in customer's loyalty summary
      description: |
        Returns the current points balance, tier, progress to the next tier
        and any active tier coupons for the signed-in customer.
      responses:
        "200":
          description: Loyalty summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyMeResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/loyalty/{customerId}:
    get:
      operationId: getAdminLoyalty
      tags: [loyalty]
      summary: Admin — full loyalty history for a customer
      description: |
        Operator support view. Returns the customer's current summary plus the
        full points ledger and every coupon (active, used, replaced).
        Authenticated via the `x-push-admin-token` header (PUSH_ADMIN_TOKEN).
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Loyalty history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyAdminResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /woo/order:
    post:
      operationId: createWooOrder
      tags: [woo]
      summary: Place an order
      description: |
        Submits a new order to WooCommerce and the Presentail OS. Prices and
        delivery fees are resolved server-side from the product cache; client-
        supplied amounts are ignored. The optional `marketing_attribution` field
        carries first-touch / last-touch UTM and Google Ads click IDs so ad
        spend can be correlated with purchases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WooOrderRequest"
      responses:
        "200":
          description: Order placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  wcOrderId:
                    type: integer
                  osOrderId:
                    type: string
                required:
                  - ok
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Order submission failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /woo/search:
    get:
      operationId: wooSearch
      tags: [woo]
      summary: Search products and categories by name
      description: |
        Searches the in-memory product cache and the static category list for
        entries whose name contains `q` (case-insensitive substring match).
        `q` must be 2–100 characters. Returns up to 10 products and all
        matching categories. Intended for the web storefront's search overlay.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string (2–100 characters).
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching products and categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WooSearchResult"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: WooCommerce not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/web-bridge:
    post:
      operationId: checkAuthWebBridge
      tags: [auth]
      summary: Check whether a returning shopper has an account
      description: |
        Accepts an email address and returns whether a matching local account
        exists. Used by the web sign-in flow to decide whether to show the
        password step or redirect to sign-up.

        **Enumeration trade-off:** this endpoint returns `userExists: true/false`,
        making it an email oracle. The mitigation is a dedicated per-IP rate
        limiter (10 requests / 15 min) that is stricter than the shared
        `/auth/exists` limiter. Distributed attacks rotating many IPs are not
        fully preventable by per-IP rate limiting alone — this is a deliberate
        product trade-off for UX routing purposes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthWebBridgeRequest"
      responses:
        "200":
          description: Account check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthWebBridgeResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the signed-in customer's profile
      description: |
        Returns the canonical profile for the currently signed-in customer,
        including the optional personal-information fields (gender,
        birthday, birthday-sharing preference). Requires a Bearer token.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAuthMe
      tags: [auth]
      summary: Update the signed-in customer's profile
      description: |
        Partial update for the current customer's profile. Any field that
        is omitted is left untouched. Personal-information fields can be
        cleared by sending `null` (gender, birthday). Email cannot be
        changed through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthMeUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "400":
          description: Invalid request (e.g. malformed birthday)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/favorites:
    get:
      operationId: getFavorites
      tags: [favorites]
      summary: List the signed-in customer's favorite products
      responses:
        "200":
          description: Favorites list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritesListResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Save a product to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFavoriteRequest"
      responses:
        "200":
          description: Favorite saved (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteToggleResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/favorites/share:
    post:
      operationId: createFavoriteShareLink
      tags: [favorites]
      summary: Create or refresh a public share link for the signed-in customer's favorites
      description: |
        Generates a token that lets anyone view the caller's current favorites
        list without signing in. If a valid (non-expired) link already exists
        it is refreshed to extend the 30-day window; otherwise a new token is
        minted. The link expires 30 days from the most recent call.
      responses:
        "200":
          description: Share link created or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteShareResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /favorites/share/{token}:
    get:
      operationId: getSharedFavorites
      tags: [favorites]
      summary: Retrieve a shared favorites list (public)
      description: |
        Returns the current favorites of the shopper who created the share link
        identified by `token`. Requires no authentication. Returns 404 when the
        token is unknown or the link has expired.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedFavoritesResponse"
        "404":
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/favorites/{slug}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a product from favorites
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteToggleResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/otp/send:
    post:
      operationId: sendPhoneOtp
      tags: [auth]
      summary: Send a one-time code to a phone number
      description: |
        Generates a 6-digit numeric OTP, stores it hashed with a 10-minute
        expiry, and dispatches it via SMS to the supplied phone number.
        Rate-limited to 3 sends per phone per 10 minutes. Used by the
        multi-step sign-up flow to verify the shopper's phone before
        completing registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpSendRequest"
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpSendResponse"
        "400":
          description: Invalid phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many OTP requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/otp/verify:
    post:
      operationId: verifyPhoneOtp
      tags: [auth]
      summary: Verify OTP and complete registration
      description: |
        Validates the supplied 6-digit code against the stored hash and
        expiry for the phone number, then completes account registration
        using the provided credentials. The OTP row is deleted on success.
        Returns `{ ok: false, code: "invalid_otp" }` for a wrong code,
        `{ ok: false, code: "expired_otp" }` for an expired code, or
        `{ ok: false, code: "too_many_attempts" }` after 5 wrong guesses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerifyRequest"
      responses:
        "200":
          description: OTP verified and account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerifyResponse"
        "400":
          description: Invalid request or wrong/expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /partner-application:
    post:
      operationId: submitPartnerApplication
      tags: [partner]
      summary: Submit a partner application
      description: |
        Accepts a multipart/form-data partner application form including two
        file uploads (brand profile PDF/image, product list PDF/Excel/Word).
        Stores the submission in the database and attempts to send an email
        notification to the partnerships team. Email delivery is best-effort
        and gated on SMTP configuration — the row is always saved regardless.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PartnerApplicationInput"
      responses:
        "200":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerApplicationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
  /me/occasions:
    get:
      operationId: listMyOccasions
      tags: [occasions]
      summary: List the signed-in customer's saved occasions
      description: |
        Returns every saved occasion (birthday, anniversary, etc.) belonging to
        the authenticated customer, sorted by month and day ascending.
        Requires a Bearer token or Clerk session.
      responses:
        "200":
          description: Saved occasions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccasionListResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyOccasion
      tags: [occasions]
      summary: Save a new occasion to the customer's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccasionInput"
      responses:
        "200":
          description: Occasion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccasionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/occasions/{id}:
    put:
      operationId: updateMyOccasion
      tags: [occasions]
      summary: Update one of the customer's saved occasions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccasionInput"
      responses:
        "200":
          description: Occasion updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccasionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Occasion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyOccasion
      tags: [occasions]
      summary: Delete one of the customer's saved occasions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Occasion removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccasionDeleteResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Occasion not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/payment-methods:
    get:
      operationId: listCheckoutPaymentMethods
      tags: [checkout]
      summary: List saved payment methods for the signed-in customer
      description: |
        Returns the saved Stripe payment methods (cards) for the authenticated
        customer. Returns an empty array if the customer has no saved cards or
        has never opted in to saving a card. Requires a Bearer token or Clerk
        session; guests receive a 401.
      responses:
        "200":
          description: Saved payment methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPaymentMethodsResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/payment-methods/{id}:
    delete:
      operationId: deleteCheckoutPaymentMethod
      tags: [checkout]
      summary: Delete a saved payment method
      description: |
        Detaches the specified Stripe payment method from the authenticated
        customer. The server verifies the payment method belongs to the caller
        before detaching. Returns 404 if the customer has no saved cards or the
        method is not found. Requires a Bearer token or Clerk session.
      parameters:
        - name: id
          in: path
          required: true
          description: Stripe payment method ID (pm_…)
          schema:
            type: string
      responses:
        "200":
          description: Payment method deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePaymentMethodResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment method not found or does not belong to this customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkout/payment-intent:
    post:
      operationId: createCheckoutPaymentIntent
      tags: [checkout]
      summary: Create a Stripe PaymentIntent for inline card payment
      description: |
        Creates a Stripe PaymentIntent for the supplied cart. Cart prices are
        resolved server-side from the Presentail OS catalog (never from
        client-supplied values) so the client cannot manipulate the charge.
        Returns a `clientSecret` that the web client passes to Stripe Elements'
        `confirmCardPayment`. The `orderId` returned must be used as-is when
        submitting the WooCommerce order after payment is confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentIntentRequest"
      responses:
        "200":
          description: PaymentIntent created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPaymentIntentResponse"
        "400":
          description: Invalid request (missing orderId, empty cart, invalid quantities)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more cart products not found in the catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/referral-code:
    get:
      operationId: getMyReferralCode
      tags: [referral]
      summary: Get the signed-in customer's unique referral code
      description: |
        Returns a stable referral code derived from the customer's local ID
        (base-36 encoded, uppercased, prefixed with PT). No database storage
        required — the code is fully deterministic. Requires a Bearer token or
        Clerk session.
      responses:
        "200":
          description: Referral code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCodeResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/next-id:
    post:
      operationId: getNextOrderId
      tags: [orders]
      summary: Reserve the next sequential order ID for a delivery country
      description: |
        Atomically increments the per-country order ID counter and returns the
        next available ID in the form `{PREFIX}-{NUMBER}` (e.g. `LB-1000`).
        Supported prefixes: LB (Lebanon), AE (UAE), CY (Cyprus). Any unknown
        countryCode falls back to LB. No authentication required — guest
        checkout is supported and the occasional number burn on an abandoned
        checkout is acceptable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextOrderIdRequest"
      responses:
        "200":
          description: Reserved order ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextOrderIdResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /page-descriptions:
    get:
      summary: Get contextual description for a category or occasion page
      tags: [page-descriptions]
      parameters:
        - name: page_type
          in: query
          required: true
          schema:
            type: string
            enum: [category, occasion]
        - name: slug
          in: query
          required: true
          schema:
            type: string
        - name: delivery_area_id
          in: query
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [en, ar, fr]
            default: en
      responses:
        "200":
          description: Description retrieved (or fallback returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDescriptionResponse"
  /admin/page-descriptions:
    get:
      summary: List all contextual description rows for a slug
      tags: [admin]
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
        - name: page_type
          in: query
          required: false
          schema:
            type: string
            enum: [category, occasion]
      responses:
        "200":
          description: Description rows for the slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPageDescriptionsListResponse"
  /admin/page-descriptions/{id}:
    put:
      summary: Manually set a description and mark as manual override
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPageDescriptionUpdateRequest"
      responses:
        "200":
          description: Updated description row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPageDescriptionUpdateResponse"
  /admin/page-descriptions/generate:
    post:
      summary: Enqueue a single description generation job
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPageDescriptionGenerateRequest"
      responses:
        "200":
          description: Job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPageDescriptionGenerateResponse"
  /admin/page-descriptions/generate-all:
    post:
      summary: Bulk-seed description generation (all areas, all languages, optional filters)
      tags: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPageDescriptionGenerateAllRequest"
      responses:
        "200":
          description: Jobs enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPageDescriptionGenerateAllResponse"
components:
  schemas:
    CheckoutPaymentIntentCartItem:
      type: object
      properties:
        wcId:
          type: integer
          minimum: 0
          description: WooCommerce product ID. Use 0 for OS-native products not mirrored in WooCommerce; supply osSlug in that case.
        osSlug:
          type: string
          description: Presentail OS product slug. Required when wcId is 0 (OS-native product). The server resolves the price from the OS cache by slug.
        quantity:
          type: integer
          minimum: 1
      required:
        - quantity
    CheckoutPaymentIntentRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutPaymentIntentCartItem"
          minItems: 1
          description: Cart items. Prices are resolved server-side and never read from the client.
        orderId:
          type: string
          description: App-generated order ID that binds this PaymentIntent to the WooCommerce order.
        currency:
          type: string
          description: ISO 4217 currency code (default USD). The PaymentIntent is charged in this currency.
        email:
          type: string
          description: Shopper email for Stripe receipt. Optional.
        deliveryFeeUsd:
          type: number
          description: Client-computed delivery fee in USD (district fee + express surcharge + slot fee). The server adds this to the product subtotal and charges the combined total. Must be >= 0.
        district:
          type: string
          description: Delivery district name. Stored in the payment intent snapshot for audit; delivery fee is taken from deliveryFeeUsd.
        expressDelivery:
          type: boolean
          description: Whether express delivery is selected. Stored in the snapshot for audit; surcharge is included in deliveryFeeUsd.
        noAddress:
          type: boolean
          description: True when the shopper chose "no address". Stored in the snapshot for audit.
        deliverySlot:
          type: string
          description: Selected delivery time-slot label (e.g. "Morning 9am-1pm"). Stored in the payment intent snapshot so the order-finalization guard can compare it to the submitted order's slot. Pass an empty string (or omit) when no slot is selected or for express delivery.
        cityId:
          type: string
          description: OS city ID used server-side to look up the slot's extraFee from the locations cache. Required when deliverySlot is set and a slot surcharge applies.
        couponCode:
          type: string
          description: Promo/coupon code to apply. The server re-validates the code and deducts the discount from the charged amount. Client-supplied discount amounts are never trusted.
        saveCard:
          type: boolean
          description: When true and the request is authenticated, the server creates/retrieves a Stripe Customer for this shopper and sets setup_future_usage=off_session so Stripe saves the card for future use. Ignored for unauthenticated requests.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Extra key-value pairs forwarded to Stripe PaymentIntent metadata.
      required:
        - items
        - orderId
    SavedPaymentMethod:
      type: object
      properties:
        id:
          type: string
          description: Stripe payment method ID (pm_…)
        brand:
          type: string
          description: Card brand (visa, mastercard, amex, etc.)
        last4:
          type: string
          description: Last 4 digits of the card number
        expMonth:
          type: integer
          description: Card expiry month (1-12)
        expYear:
          type: integer
          description: Card expiry year (4 digits)
      required:
        - id
        - brand
        - last4
        - expMonth
        - expYear
    ListPaymentMethodsResponse:
      type: object
      properties:
        ok:
          type: boolean
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/SavedPaymentMethod"
      required:
        - ok
        - paymentMethods
    DeletePaymentMethodResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    CheckoutPaymentIntentResponse:
      type: object
      properties:
        ok:
          type: boolean
        clientSecret:
          type: string
          description: Stripe PaymentIntent client_secret. Pass to stripe.confirmCardPayment().
        orderId:
          type: string
          description: The orderId that was bound to this PaymentIntent. Use as-is in /woo/order.
        amount:
          type: integer
          description: Charge amount in Stripe minor units (e.g. cents for USD).
        currency:
          type: string
          description: ISO 4217 currency code used for the charge.
      required:
        - ok
        - clientSecret
        - orderId
        - amount
        - currency
    PartnerApplicationInput:
      type: object
      properties:
        country:
          type: string
        city:
          type: string
        brandName:
          type: string
        website:
          type: string
        categories:
          type: array
          items:
            type: string
        otherCategory:
          type: string
        socialMedia:
          type: string
        contactFirstName:
          type: string
        contactLastName:
          type: string
        contactRole:
          type: string
        email:
          type: string
          format: email
        dialCode:
          type: string
        phone:
          type: string
      required:
        - country
        - city
        - brandName
        - website
        - categories
        - contactFirstName
        - contactLastName
        - contactRole
        - email
        - dialCode
        - phone
    PartnerApplicationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: integer
      required:
        - ok
        - id
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        code:
          type: string
          description: >
            Machine-readable failure class (e.g. payment_declined,
            gateway_endpoint_error, gateway_auth_error,
            gateway_validation_error, gateway_error) so clients can map
            errors to accurate user-facing messages.
        declineCode:
          type: string
          description: >
            Sanitized processor status/reason (e.g. DECLINED, "HTTP 404")
            for payment failures. Never contains card data.
        requestId:
          type: string
          description: >
            Sanitized upstream request identifier for support correlation. Never contains card data.
      required:
        - ok
        - message
    PushPlatform:
      type: string
      enum: [ios, android, web]
    PushRegisterRequest:
      type: object
      properties:
        token:
          type: string
          description: The Expo push token, or APNs/FCM token in production builds.
        platform:
          $ref: "#/components/schemas/PushPlatform"
        deviceId:
          type: string
          description: A stable per-device identifier so guest devices can receive pushes.
        userId:
          type: integer
          description: Optional client-provided WC customer id; ignored when an Authorization header is present.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code of the device's currently selected store. Used to scope silent data-refresh pushes per store.
        cityId:
          type: string
          description: Optional city id of the device's currently selected store (e.g. ae-abu-dhabi).
      required:
        - token
        - platform
    PushRegisterResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    PushUnregisterRequest:
      type: object
      properties:
        token:
          type: string
        deviceId:
          type: string
    PushUnregisterResponse:
      type: object
      properties:
        ok:
          type: boolean
        removed:
          type: integer
      required:
        - ok
        - removed
    ClientErrorReportRequest:
      type: object
      properties:
        message:
          type: string
          description: The error message. Truncated server-side at 2000 characters.
        stack:
          type: string
          description: The JS stack trace, when available. Truncated server-side at 8000 characters.
        componentStack:
          type: string
          description: The React component stack captured by the error boundary, when available. Truncated server-side at 4000 characters.
        route:
          type: string
          description: The route or screen name where the error happened (e.g. "product/[slug]" or "root").
        boundary:
          type: string
          enum: [route, root]
          description: Which error boundary caught the error. Defaults to "route" when omitted.
        platform:
          type: string
          enum: [ios, android, web]
          description: The client platform that produced the report.
        appVersion:
          type: string
          description: The app's display version (e.g. expo.version).
        buildNumber:
          type: string
          description: The native build number (iOS buildNumber / Android versionCode), when available.
        deviceId:
          type: string
          description: A stable per-device identifier for correlating multiple reports from the same device. Not a user identifier.
      required:
        - message
    ClientErrorReportResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    AnalyticsEventName:
      type: string
      description: |
        Allowlisted analytics event name. Adding a new event requires a
        spec change so we never log unbounded user-controlled strings.

        The four `cart_viewed` / `checkout_started` /
        `payment_method_selected` / `order_placed` events form the
        broader purchase funnel that the server-side
        `checkoutPurchaseFunnelMonitor` evaluates step-to-step so we
        notice when any single step collapses.

        `web_vital` events carry real-user Core Web Vital measurements
        (LCP, INP, CLS, TTFB, FCP). The metric name is stored in `action`
        and the raw value (ms for timing metrics, unitless for CLS) in
        `metricValue`. The server-side `webVitalsMonitor` evaluates the
        prior UTC day's LCP median and alerts via Slack when it crosses
        the configured threshold.

        `mobile_ttid` events carry time-to-interactive measurements for
        key mobile screens (home, product, brand, category, occasion). The
        screen name is stored in `action` and the elapsed time in ms in
        `metricValue`. The same `webVitalsMonitor` daily digest includes
        mobile TTID rows so web and mobile performance are visible in a
        single Slack message.

        `geo_currency_fallback` is recorded server-side whenever the IP
        geolocation lookup for `/api/geo/currency` fails on both providers
        (ipapi.co and ipwho.is), causing the shopper to be silently shown
        USD prices. The `geoCurrencyFallbackMonitor` counts these events
        per hour and fires a Slack alert when the count exceeds the
        configured threshold.

        `payment_wallet_opened` is emitted when the native wallet sheet
        (Apple Pay / Google Pay) successfully opens on web or mobile. The
        `action` field carries `apple_pay` or `google_pay` on both web
        and mobile (determined by the browser / platform at confirmation time).

        `payment_wallet_fallback` is emitted when the wallet sheet could
        not be opened and the checkout silently falls back to the card
        form. The `errorCode` field carries the reason:
        `constructor_failed` (web — PaymentRequest constructor threw),
        `show_failed` (web — pr.show() threw synchronously), or
        `not_available` (mobile — isPlatformPaySupported returned false).

        `product_lifecycle_410` is recorded by `serve.mjs` whenever a
        product URL returns HTTP 410 Gone because the product slug is
        absent from `scripts/productRedirects.mjs` (product discontinued
        with no redirect entry). The `productId` field carries the slug.
        The server-side `productLifecycle410Monitor` queries these events
        daily and fires a Slack alert listing all affected slugs so ops
        can add redirect entries before link equity is permanently lost.
      enum:
        - checkout_login_prompt_viewed
        - checkout_login_prompt_action
