      description: A single row from the plant_environment_cache table.
      properties:
        osProductId:
          type: string
        classification:
          type: string
          enum: [indoor, outdoor]
        source:
          type: string
          enum: [ai, admin, fallback]
        needsReview:
          type: boolean
        contentHash:
          type: string
        classifiedAt:
          type: string
      required: [osProductId, classification, source, needsReview, contentHash, classifiedAt]
    AdminPlantClassificationsListResponse:
      type: object
      properties:
        ok:
          type: boolean
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PlantClassificationRow"
      required: [ok, rows]
    PlantClassificationOverrideRequest:
      type: object
      properties:
        classification:
          type: string
          enum: [indoor, outdoor]
      required: [classification]
    PlantClassificationOverrideResponse:
      type: object
      properties:
        ok:
          type: boolean
        row:
          $ref: "#/components/schemas/PlantClassificationRow"
      required: [ok]
    PlantReclassifyResponse:
      type: object
      properties:
        ok:
          type: boolean
        osProductId:
          type: string
        result:
          type: object
          nullable: true
      required: [ok, osProductId]
    PlantBulkReclassifyResponse:
      type: object
      properties:
        ok:
          type: boolean
        classified:
          type: integer
        keepManual:
          type: boolean
      required: [ok, classified, keepManual]
    StuffedAnimalsSizesResponse:
      type: object
      description: AI-inferred size classification for stuffed-animals products.
      properties:
        sizes:
          type: object
          description: Map of product ID (string) to size bucket.
          additionalProperties:
            type: string
            enum: [small, medium, life-size]
      required:
        - sizes
    NewbornGenderResponse:
      type: object
      description: AI-inferred gender classification for new-born occasion products.
      properties:
        genders:
          type: object
          description: Map of product ID (string) to gender bucket.
          additionalProperties:
            type: string
            enum: [boy, girl, neutral]
      required:
        - genders
    WebEventItem:
      type: object
      description: A single line item in a cart or checkout event.
      properties:
        productId:
          type: string
          description: OS product slug or identifier.
          maxLength: 128
        name:
          type: string
          description: Product display name.
          maxLength: 256
        price:
          type: number
          format: float
          description: Unit price in USD.
        quantity:
          type: integer
          minimum: 1
          description: Quantity of this product.
      required:
        - productId
        - name
        - price
        - quantity
    WebEventTypeName:
      type: string
      description: |
        Allowlisted event type names for the POST /web-events endpoint.
        Only these 7 values are accepted; the server rejects any other string.
      enum:
        - product_view
        - add_to_cart
        - checkout_step
        - payment_started
        - payment_completed
        - promo_applied
        - promo_failed
    WebEventBody:
      type: object
      description: A single web funnel event.
      properties:
        type:
          $ref: "#/components/schemas/WebEventTypeName"
        sessionId:
          type: string
          maxLength: 36
          description: Client session UUID. Events without this are silently dropped.
        value:
          type: number
          format: float
          description: Monetary value associated with the event (e.g. cart total in USD).
        currency:
          type: string
          maxLength: 8
          description: ISO 4217 currency code (e.g. "USD", "AED").
        brand:
          type: string
          maxLength: 128
          description: Brand name of the primary product (for add_to_cart events).
        city:
          type: string
          maxLength: 128
          description: Delivery city selected by the shopper.
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebEventItem"
          description: Line items for add_to_cart and checkout_step events.
        properties:
          type: object
          description: |
            Arbitrary structured metadata for the event. For checkout_step:
            `slot` (delivery slot label), `deliveryFee` (total delivery fee in USD).
          additionalProperties: true
      required:
        - type
    PostWebEventsBody:
      oneOf:
        - $ref: "#/components/schemas/WebEventBody"
        - type: object
          properties:
            events:
              type: array
              minItems: 1
              maxItems: 500
              items:
                $ref: "#/components/schemas/WebEventBody"
          required:
            - events
    PostWebEventsResponse:
      type: object
      properties:
        ok:
          type: boolean
        accepted:
          type: integer
          description: Number of events accepted for storage (excludes dropped events).
        dropped:
          type: integer
          description: Number of events dropped (missing sessionId).
      required:
        - ok
        - accepted
        - dropped
    SeasonalBoost:
      type: object
      description: A date-window boost applied to a collection item when today falls within the window.
      properties:
        label:
          type: string
          description: Human-readable label (e.g. "Valentine's Day").
        startMmDd:
          type: string
          description: Start of the window as MM-DD (e.g. "02-01"). Wrap-around supported (e.g. "12-25" → "01-07").
        endMmDd:
          type: string
          description: End of the window as MM-DD (e.g. "02-14"), inclusive.
        boost:
          type: number
          description: Additive score bonus applied within the window (e.g. 0.4).
      required: [label, startMmDd, endMmDd, boost]
    CollectionRankingConfigRow:
      type: object
      description: Per-slug ranking configuration for a homepage category or occasion.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [category, occasion]
        slug:
          type: string
        countryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code. Null = global default.
        manualBoost:
          type: number
          description: Additive score bonus applied at all times.
        pinnedPosition:
          type: integer
          nullable: true
          description: 1-based position to force the item into after scoring. Null = no pin.
        hiddenOverride:
          type: boolean
          description: When true the item is excluded from the carousel regardless of score.
        seasonalBoosts:
          type: array
          items:
            $ref: "#/components/schemas/SeasonalBoost"
      required: [id, kind, slug, manualBoost, hiddenOverride, seasonalBoosts]
    CollectionRankingConfigUpsertRequest:
      type: object
      description: Fields to set on a collection ranking config row. All fields are optional — omitted fields are left unchanged on update.
      properties:
        countryCode:
          type: string
          nullable: true
        manualBoost:
          type: number
        pinnedPosition:
          type: integer
          nullable: true
        hiddenOverride:
          type: boolean
        seasonalBoosts:
          type: array
          items:
            $ref: "#/components/schemas/SeasonalBoost"
    CollectionRankingConfigUpsertResponse:
      type: object
      properties:
        ok:
          type: boolean
        row:
          $ref: "#/components/schemas/CollectionRankingConfigRow"
      required: [ok]
    CollectionRankingConfigListResponse:
      type: object
      properties:
        ok:
          type: boolean
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CollectionRankingConfigRow"
      required: [ok, rows]
