        title:
          type: string
        subtitle:
          type: string
        ctaText:
          type: string
        desktopMediaType:
          $ref: "#/components/schemas/HomepageBannerMediaType"
        desktopMediaUrl:
          type: string
        desktopLinkUrl:
          type: string
        mobileMediaType:
          $ref: "#/components/schemas/HomepageBannerMediaType"
        mobileMediaUrl:
          type: string
        mobileLinkUrl:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
