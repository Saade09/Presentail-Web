          $ref: "#/components/schemas/AuthMeResponse"
        code:
          type: string
          description: Error code when ok is false.
          enum:
            - invalid_otp
            - expired_otp
            - too_many_attempts
      required:
        - ok
    WooOrderRequest:
      type: object
      description: Request body for placing an order via the WooCommerce/OS backend.
      properties:
        orderId:
          type: string
          description: Client-generated idempotency key for the order.
        paymentRef:
          type: string
          description: Payment reference returned by the payment provider.
        paymentMethod:
          type: string
          enum: [card, wallet, apple_pay, google_pay, whish, western, mamo, paypal]
        couponCode:
          type: string
        currencyCode:
          type: string
        marketing_attribution:
          $ref: "#/components/schemas/MarketingAttribution"
        whatsappOptIn:
          type: boolean
          description: |
            True when the sender left "Get order updates on WhatsApp" checked at
            checkout. Absent/false means no WhatsApp transactional updates for
            this order. The target number is the sender's billing phone.
      required:
        - orderId
        - paymentMethod
    MarketingAttribution:
      type: object
      description: |
        First-touch / last-touch marketing attribution captured from UTM parameters
        and Google Ads click IDs (gclid, gbraid, wbraid). Attached to orders so
        ad spend can be correlated with purchases. All fields are optional strings
        so partial or missing attribution data never fails validation.
      properties:
        source:
          type: string
          description: Platform that submitted the order (e.g. "website" or "mobile").
        first_touch:
          type: object
          description: Attribution data from the shopper's first marketing-attributed session.
          additionalProperties:
            type: string
        last_touch:
          type: object
          description: Attribution data from the shopper's most recent marketing-attributed session.
          additionalProperties:
            type: string
        conversion:
          type: object
          description: Conversion metadata recorded at order placement.
          properties:
            order_total:
              type: string
              description: Order total in the shopper's display currency.
            currency:
              type: string
              description: ISO 4217 currency code of the order total.
            converted_at:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the order was placed.
    FrequentlyBoughtTogetherProduct:
      type: object
      description: A product returned in the frequently bought together list.
      properties:
        slug:
          type: string
          description: OS product slug (unique identifier).
        id:
          type: string
          description: OS product id (same as slug).
        name:
          type: string
          description: Display name of the product.
        price:
          type: number
          description: Price in USD.
        priceValue:
          type: number
          description: Price in USD (alias for price).
        category:
          type: string
          description: Primary category slug.
        inStock:
          type: boolean
          description: Whether the product is currently in stock.
        images:
          type: array
          description: Product images.
          items:
            type: object
            properties:
              uri:
                type: string
            required: [uri]
        discountPriceValue:
          type: number
          nullable: true
          description: Discounted price in USD, or null if no discount.
        discountPriceAed:
          type: number
          nullable: true
          description: Discounted price in AED, or null if no discount.
        personalisationRequired:
          type: boolean
          nullable: true
          description: >
            When true, the personalisation note input is mandatory — the shopper
            must fill it before adding to cart (e.g. letter boxes, engraved
            items, printing products). Defaults to false (optional) when not yet
            classified by AI inference.
        isBestSeller:
          type: boolean
          description: Whether this product is in the top 20 by total sales across all stores.
      required: [slug, id, name, price, category, inStock, images]
