        addressLine:
          type: string
        apartment:
          type: string
          nullable: true
        building:
          type: string
          nullable: true
        directions:
          type: string
          nullable: true
        recipientFirstName:
          type: string
          nullable: true
        recipientLastName:
          type: string
          nullable: true
        recipientPhoneCountryCode:
          type: string
          nullable: true
        recipientPhone:
