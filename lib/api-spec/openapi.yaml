    DeliveryTimeSlot:
      type: object
      properties:
        label:
          type: string
          description: Human-readable slot label (e.g. "Morning (9 AM – 12 PM)").
        slotId:
          type: string
          description: Unique slot identifier from Presentail OS. Present when the OS assigns per-slot IDs; absent for legacy hardcoded slots. Used as the React key and for ID-first slot lookup on the backend.
        startHour:
          type: integer
          description: Hour of day (0–23) the slot window opens (e.g. 9 for 9 AM). Optional; absent when the OS has not configured window boundaries.
        endHour:
          type: integer
          description: Hour of day (0–23) the slot window closes (e.g. 14 for 2 PM). Optional; absent when the OS has not configured window boundaries.
        cutoffHour:
          type: number
          nullable: true
          description: Hour of day (0–23) after which this slot can no longer be booked for same-day delivery. Null when the OS has not configured a cutoff for this slot.
        extraFee:
          type: number
          description: Additional surcharge (USD) for booking this slot, e.g. a night-delivery fee.
        sameDayEnabled:
          type: boolean
          description: Whether this slot is available for same-day (today) delivery. Absent means eligible for all dates. Use to filter slots for today when the OS configures separate same-day and next-day variants of the same window.
        nextDayEnabled:
          type: boolean
          description: Whether this slot is available for next-day delivery. Absent means eligible for all dates.
      required:
        - label
    DeliveryCity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        fee:
          type: number
          description: Delivery fee in the country's native currency.
        expressAvailable:
          type: boolean
          description: Whether express/same-day delivery is available for this city.
        expressDeliveryLabel:
          type: string
          description: Human-readable express delivery promise for this city (e.g. "Arrives in 90 minutes").
        sameDayCutoffHour:
          type: number
          description: Hour of day (0–23, local time) after which same-day delivery cannot be booked.
        timeSlots:
          type: array
          description: Available delivery time slots for this city. Empty array means slots are not yet configured.
          items:
            $ref: "#/components/schemas/DeliveryTimeSlot"
        slotsByDay:
          type: object
          description: Per-day-of-week time slots keyed by lowercase English weekday name (e.g. "monday"). When present, use slotsByDay[dayOfWeek] for the selected delivery date instead of the flat timeSlots array, falling back to timeSlots when the day key is absent.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/DeliveryTimeSlot"
        localizedNames:
          $ref: "#/components/schemas/LocalizedNames"
        freeDeliveryThresholdUsd:
          type: number
          description: Free-delivery threshold in USD for this city from Presentail OS. Overrides the country-level threshold when present.
        freeDeliveryEnabled:
