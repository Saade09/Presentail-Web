openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: push
    description: Push notification operations
  - name: deliveryLocations
    description: Supported delivery countries and cities
  - name: homepage
    description: Homepage feed content (banners, etc.)
  - name: deliveryConfig
    description: Per-city express delivery time and free-delivery threshold copy
  - name: geo
    description: IP-based geolocation helpers (display currency hints)
  - name: clientErrors
    description: Client-side crash reports from mobile and web clients
  - name: analytics
    description: Lightweight client-side product analytics events
  - name: auth
    description: Account profile operations for the signed-in customer
  - name: meAddresses
    description: Saved delivery addresses owned by the signed-in customer
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /push/register:
    post:
      operationId: registerPushToken
      tags: [push]
      summary: Register a device push token
      description: |
        Register an Expo push token (or APNs/FCM token in production) for the
        current device. When the request is authenticated, the token is
        associated with the signed-in user; otherwise it is associated only
        with the supplied deviceId so guest devices can still receive pushes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterRequest"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegisterResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/unregister:
    post:
      operationId: unregisterPushToken
      tags: [push]
      summary: Unregister a device push token
      description: |
        Remove a previously-registered push token. Either token or deviceId
        must be provided. Called on sign-out, account deletion, or when the
        device permission is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnregisterRequest"
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushUnregisterResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /push/order-event:
    post:
      operationId: sendOrderEventPush
      tags: [push]
      summary: Trigger an order-event push notification (admin)
      description: |
        Looks up the registered tokens for the recipient of the given order
        and sends an order-state push (confirmed, out-for-delivery,
        delivered). Requires the X-Push-Admin-Token header to match
        PUSH_ADMIN_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushOrderEventRequest"
      responses:
        "200":
          description: Pushes sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOrderEventResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client-errors:
    post:
      operationId: reportClientError
      tags: [clientErrors]
      summary: Report a client-side crash
      description: |
        Accepts a single crash report from a mobile or web client. Used by the
        per-screen and root error boundaries to surface real crashes in the
        server logs (and any downstream log sink) instead of leaving them only
        in the device console. Bodies are intentionally bounded; messages and
        stacks longer than the hard limit are truncated server-side. PII
        scrubbing is the client's responsibility, but the server also drops
        obviously sensitive substrings (bearer tokens, JWTs, emails, phone
        numbers) defensively before logging. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReportRequest"
      responses:
        "200":
          description: Report acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorReportResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analytics/events:
    post:
      operationId: recordAnalyticsEvent
      tags: [analytics]
      summary: Record a client-side analytics event
      description: |
        Accepts a single lightweight product-analytics event from a web or
        mobile client (for example, which button a shopper picked on the
        checkout login prompt). Events are bounded, validated against an
        allowlist of known event names, and forwarded to the server log
        sink that downstream BI/dashboards already consume — there is no
        separate analytics destination configured today. Rate-limited per
        IP. The server never trusts client-supplied user identifiers; the
        signed-in user (if any) is read from the session cookie instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventRequest"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /homepage/banners:
    get:
      operationId: getHomepageBanners
      tags: [homepage]
      summary: Get active homepage hero banners
      description: |
        Returns the active homepage hero banner carousel for the supplied
        country. Banners are filtered server-side by isActive, the optional
        startsAt/endsAt window (inclusive bounds against the current server
        time), and country code (entries with countryCode "*" match every
        country). Results are sorted by sortOrder ascending.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 country code (case-insensitive) used to filter
            country-targeted banners. Wildcard "*" or omission returns only
            the global ("*") banners.
          schema:
            type: string
      responses:
        "200":
          description: Active banners for the country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageBannersResponse"
  /homepage/categories:
    get:
      operationId: getHomepageCategories
      tags: [homepage]
      summary: Get curated homepage Categories carousel items
      description: |
        Returns the curated list of items for the homepage "Categories"
        carousel. The list is sourced from WooCommerce product categories
        whose parent has slug `home-categories`, mapped into the shared
        `HomepageCollectionItem` shape, sorted by `sortOrder` ascending.
        If WooCommerce credentials are unset or the parent category does
        not yet exist in WP admin, a sensible hand-rolled default set is
        returned so the homepage is never blank during admin setup. On a
        WooCommerce network/HTTP failure the endpoint instead returns an
        empty `items` array (still 200) so the client hides the section
        rather than rendering stale defaults.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 country code (case-insensitive) used to
            resolve which WooCommerce store the categories are sourced
            from. When omitted, the server falls back to Lebanon.
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: |
            City identifier (e.g. "ae-dubai", "ae-abu-dhabi") used to
            resolve a city-specific WooCommerce store when the country
            alone is ambiguous.
          schema:
            type: string
      responses:
        "200":
          description: Categories carousel items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageCollectionResponse"
  /homepage/occasions:
    get:
      operationId: getHomepageOccasions
      tags: [homepage]
      summary: Get curated homepage Occasions carousel items
      description: |
        Returns the curated list of items for the homepage "Occasions"
        carousel. The list is sourced from WooCommerce product categories
        whose parent has slug `home-occasions`, mapped into the shared
        `HomepageCollectionItem` shape, sorted by `sortOrder` ascending.
        If WooCommerce credentials are unset or the parent category does
        not yet exist in WP admin, a sensible hand-rolled default set is
        returned. On a WooCommerce network/HTTP failure the endpoint
        instead returns an empty `items` array (still 200) so the client
        hides the section rather than rendering stale defaults.
      responses:
        "200":
          description: Occasions carousel items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageCollectionResponse"
  /delivery-config:
    get:
      operationId: getDeliveryConfig
      tags: [deliveryConfig]
      summary: Get delivery copy for a country/city
      description: |
        Returns the express-delivery time label, the free-delivery threshold
        copy and the currency code Presentail uses for the given country and
        (optionally) city. Values are sourced from a server-side config so
        operations can change them without a client release. Falls back to
        the country default when cityId is unknown, and to a global default
        when countryCode is unknown.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country code (case-insensitive).
          schema:
            type: string
        - name: cityId
          in: query
          required: false
          description: Optional city id from /delivery-locations.
          schema:
            type: string
      responses:
        "200":
          description: Delivery config for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConfigResponse"
  /geo/currency:
    get:
      operationId: getGeoCurrency
      tags: [geo]
      summary: Detect display currency from the caller's IP
      description: |
        Resolves the caller's country from their IP address and maps it to a
        display currency. Used by the storefront and mobile app to seed the
        initial display currency on first visit so visitors see prices in
        their local currency without changing any setting. The endpoint is
        cached in-memory for a short TTL per IP and degrades gracefully to
        `{ countryCode: null, currencyCode: "USD" }` on lookup failure or
        timeout. Currency selection here is display-only and does not change
        which WooCommerce store, payment provider currency, or delivery
        country is used.
      responses:
        "200":
          description: Detected display currency for the caller's IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCurrencyResponse"
  /geo/currency-by-coords:
    get:
      operationId: getGeoCurrencyByCoords
      tags: [geo]
      summary: Detect display currency from device coordinates
      description: |
        Resolves the supplied latitude/longitude (typically from the device's
        coarse foreground location, with the user's permission) to an ISO
        country code and maps it to a display currency. Used by the mobile
        app as the primary currency-detection path so shoppers on a VPN, on
        a foreign SIM while roaming, or behind a carrier CGNAT that
        resolves to the wrong country still see prices in their actual
        local currency. Same response shape as `/geo/currency`. Invalid or
        out-of-range coordinates and any lookup failure degrade gracefully
        to `{ countryCode: null, currencyCode: "USD" }`.
      parameters:
        - name: lat
          in: query
          required: true
          description: WGS84 latitude in decimal degrees, range -90..90.
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          description: WGS84 longitude in decimal degrees, range -180..180.
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Detected display currency for the supplied coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCurrencyResponse"
  /me/addresses:
    get:
      operationId: listMyAddresses
      tags: [meAddresses]
      summary: List the signed-in customer's saved delivery addresses
      description: |
        Returns every saved address that belongs to the authenticated
        customer, sorted with the default address first and then by most
        recently updated. Requires a valid Bearer token (legacy WP/social
        JWT or a Clerk session). Other users' addresses are never returned.
      responses:
        "200":
          description: Saved addresses for the current customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressListResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyAddress
      tags: [meAddresses]
      summary: Save a new delivery address to the customer's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "200":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/addresses/{id}:
    patch:
      operationId: updateMyAddress
      tags: [meAddresses]
      summary: Update one of the customer's saved addresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressPatchInput"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyAddress
      tags: [meAddresses]
      summary: Delete one of the customer's saved addresses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Address removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressDeleteResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/addresses/{id}/default:
    post:
      operationId: setMyDefaultAddress
      tags: [meAddresses]
      summary: Mark a saved address as the customer's default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Address marked as default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddressResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /delivery-locations:
    get:
      operationId: getDeliveryLocations
      tags: [deliveryLocations]
      summary: List supported delivery countries and cities
      description: |
        Returns the canonical list of countries and cities Presentail can
        deliver to, including their isActive flags, currency, flag emoji
        and display ordering. Consumed by the mobile app on launch so
        toggling a country or city in the backend (no app update
        required) is reflected on the next launch.
      responses:
        "200":
          description: Delivery locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLocationsResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the signed-in customer's profile
      description: |
        Returns the canonical profile for the currently signed-in customer,
        including the optional personal-information fields (gender,
        birthday, birthday-sharing preference). Requires a Bearer token.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAuthMe
      tags: [auth]
      summary: Update the signed-in customer's profile
      description: |
        Partial update for the current customer's profile. Any field that
        is omitted is left untouched. Personal-information fields can be
        cleared by sending `null` (gender, birthday). Email cannot be
        changed through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthMeUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "400":
          description: Invalid request (e.g. malformed birthday)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
        - ok
        - message
    PushPlatform:
      type: string
      enum: [ios, android, web]
    PushRegisterRequest:
      type: object
      properties:
        token:
          type: string
          description: The Expo push token, or APNs/FCM token in production builds.
        platform:
          $ref: "#/components/schemas/PushPlatform"
        deviceId:
          type: string
          description: A stable per-device identifier so guest devices can receive pushes.
        userId:
          type: integer
          description: Optional client-provided WC customer id; ignored when an Authorization header is present.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code of the device's currently selected store. Used to scope silent data-refresh pushes per store.
        cityId:
          type: string
          description: Optional city id of the device's currently selected store (e.g. ae-abu-dhabi).
      required:
        - token
        - platform
    PushRegisterResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    PushUnregisterRequest:
      type: object
      properties:
        token:
          type: string
        deviceId:
          type: string
    PushUnregisterResponse:
      type: object
      properties:
        ok:
          type: boolean
        removed:
          type: integer
      required:
        - ok
        - removed
    ClientErrorReportRequest:
      type: object
      properties:
        message:
          type: string
          description: The error message. Truncated server-side at 2000 characters.
        stack:
          type: string
          description: The JS stack trace, when available. Truncated server-side at 8000 characters.
        componentStack:
          type: string
          description: The React component stack captured by the error boundary, when available. Truncated server-side at 4000 characters.
        route:
          type: string
          description: The route or screen name where the error happened (e.g. "product/[slug]" or "root").
        boundary:
          type: string
          enum: [route, root]
          description: Which error boundary caught the error. Defaults to "route" when omitted.
        platform:
          type: string
          enum: [ios, android, web]
          description: The client platform that produced the report.
        appVersion:
          type: string
          description: The app's display version (e.g. expo.version).
        buildNumber:
          type: string
          description: The native build number (iOS buildNumber / Android versionCode), when available.
        deviceId:
          type: string
          description: A stable per-device identifier for correlating multiple reports from the same device. Not a user identifier.
      required:
        - message
    ClientErrorReportResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    AnalyticsEventName:
      type: string
      description: |
        Allowlisted analytics event name. Adding a new event requires a
        spec change so we never log unbounded user-controlled strings.

        The four `cart_viewed` / `checkout_started` /
        `payment_method_selected` / `order_placed` events form the
        broader purchase funnel that the server-side
        `checkoutPurchaseFunnelMonitor` evaluates step-to-step so we
        notice when any single step collapses.
      enum:
        - checkout_login_prompt_viewed
        - checkout_login_prompt_action
        - cart_viewed
        - checkout_started
        - payment_method_selected
        - order_placed
        - auth_social_failed
    AnalyticsEventRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/AnalyticsEventName"
        surface:
          type: string
          description: |
            Where the event was emitted from. For the checkout login
            prompt this is "cart" (cart's Proceed to Checkout button) or
            "checkout-direct" (a signed-out shopper hitting /checkout).
            For purchase-funnel events, "cart" is the cart drawer,
            "cart-screen" is the standalone cart tab/page, and
            "checkout" covers checkout_started, payment_method_selected
            and order_placed.
          enum: [cart, checkout-direct, cart-screen, checkout]
        action:
          type: string
          description: |
            For checkout-login-prompt action events, which choice the
            shopper picked. For payment_method_selected and order_placed,
            the chosen payment method id.
          enum:
            - continue
            - google
            - apple
            - guest
            - dismissed
            - card
            - wallet
            - paypal
            - mamo
            - whish
            - western
        platform:
          type: string
          enum: [ios, android, web]
          description: The client platform that produced the event.
        appVersion:
          type: string
          description: Optional app/build version string for debugging.
        errorCode:
          type: string
          maxLength: 64
          description: |
            For `auth_social_failed` events: the native SDK error code
            (e.g. iOS `-61440` = errSecMissingEntitlement, Android
            `DEVELOPER_ERROR`). Bounded length so we can never log
            unbounded user-controlled strings — the value is sourced
            from the native SDK, not the shopper.
      required:
        - name
    AnalyticsEventResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    OrderEventState:
      type: string
      enum: [confirmed, out_for_delivery, delivered]
    PushOrderEventRequest:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/OrderEventState"
        appOrderId:
          type: string
          description: Internal Presentail order id (e.g. PR-123456).
        wcOrderId:
          type: integer
          description: WooCommerce order id. Either appOrderId or wcOrderId must be provided.
        title:
          type: string
          description: Optional override for the notification title.
        body:
          type: string
          description: Optional override for the notification body.
      required:
        - state
    PushOrderEventResponse:
      type: object
      properties:
        ok:
          type: boolean
        sent:
          type: integer
      required:
        - ok
        - sent
    DeliveryCity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - name
        - isActive
    DeliveryCountry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        flag:
          type: string
          description: Flag emoji or icon for the country.
        currency:
          type: string
          description: ISO 4217 currency code used by default for this country.
        isActive:
          type: boolean
        cities:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryCity"
      required:
        - id
        - name
        - code
        - flag
        - currency
        - isActive
        - cities
    HomepageBannerMediaType:
      type: string
      enum: [image, video]
    HomepageBanner:
      type: object
      properties:
        id:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code, or "*" for global banners.
        title:
          type: string
        subtitle:
          type: string
        ctaText:
          type: string
        desktopMediaType:
          $ref: "#/components/schemas/HomepageBannerMediaType"
        desktopMediaUrl:
          type: string
        desktopLinkUrl:
          type: string
        mobileMediaType:
          $ref: "#/components/schemas/HomepageBannerMediaType"
        mobileMediaUrl:
          type: string
        mobileLinkUrl:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
        - id
