        country:
          type: string
        city:
          type: string
        brandName:
          type: string
        website:
          type: string
        categories:
          type: array
          items:
            type: string
        otherCategory:
          type: string
        socialMedia:
          type: string
        contactFirstName:
          type: string
        contactLastName:
          type: string
        contactRole:
          type: string
        email:
          type: string
          format: email
        dialCode:
          type: string
        phone:
          type: string
      required:
        - country
        - city
        - brandName
        - website
        - categories
        - contactFirstName
        - contactLastName
        - contactRole
        - email
        - dialCode
        - phone
    PartnerApplicationResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: integer
      required:
        - ok
        - id
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
        - ok
        - message
    PushPlatform:
      type: string
      enum: [ios, android, web]
    PushRegisterRequest:
      type: object
      properties:
        token:
          type: string
          description: The Expo push token, or APNs/FCM token in production builds.
        platform:
          $ref: "#/components/schemas/PushPlatform"
        deviceId:
          type: string
          description: A stable per-device identifier so guest devices can receive pushes.
        userId:
          type: integer
          description: Optional client-provided WC customer id; ignored when an Authorization header is present.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code of the device's currently selected store. Used to scope silent data-refresh pushes per store.
        cityId:
          type: string
          description: Optional city id of the device's currently selected store (e.g. ae-abu-dhabi).
      required:
        - token
        - platform
    PushRegisterResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    PushUnregisterRequest:
      type: object
      properties:
        token:
          type: string
        deviceId:
          type: string
    PushUnregisterResponse:
      type: object
      properties:
        ok:
          type: boolean
        removed:
          type: integer
      required:
        - ok
        - removed
    ClientErrorReportRequest:
      type: object
      properties:
        message:
          type: string
          description: The error message. Truncated server-side at 2000 characters.
        stack:
          type: string
          description: The JS stack trace, when available. Truncated server-side at 8000 characters.
        componentStack:
          type: string
          description: The React component stack captured by the error boundary, when available. Truncated server-side at 4000 characters.
        route:
          type: string
          description: The route or screen name where the error happened (e.g. "product/[slug]" or "root").
        boundary:
          type: string
          enum: [route, root]
          description: Which error boundary caught the error. Defaults to "route" when omitted.
        platform:
          type: string
          enum: [ios, android, web]
          description: The client platform that produced the report.
        appVersion:
          type: string
          description: The app's display version (e.g. expo.version).
        buildNumber:
          type: string
          description: The native build number (iOS buildNumber / Android versionCode), when available.
        deviceId:
          type: string
          description: A stable per-device identifier for correlating multiple reports from the same device. Not a user identifier.
      required:
        - message
    ClientErrorReportResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    AnalyticsEventName:
      type: string
      description: |
        Allowlisted analytics event name. Adding a new event requires a
        spec change so we never log unbounded user-controlled strings.

        The four `cart_viewed` / `checkout_started` /
        `payment_method_selected` / `order_placed` events form the
        broader purchase funnel that the server-side
        `checkoutPurchaseFunnelMonitor` evaluates step-to-step so we
        notice when any single step collapses.

        `web_vital` events carry real-user Core Web Vital measurements
        (LCP, INP, CLS, TTFB, FCP). The metric name is stored in `action`
        and the raw value (ms for timing metrics, unitless for CLS) in
        `metricValue`. The server-side `webVitalsMonitor` evaluates the
        prior UTC day's LCP median and alerts via Slack when it crosses
        the configured threshold.

        `mobile_ttid` events carry time-to-interactive measurements for
        key mobile screens (home, product, brand, category, occasion). The
        screen name is stored in `action` and the elapsed time in ms in
        `metricValue`. The same `webVitalsMonitor` daily digest includes
        mobile TTID rows so web and mobile performance are visible in a
        single Slack message.

        `geo_currency_fallback` is recorded server-side whenever the IP
        geolocation lookup for `/api/geo/currency` fails on both providers
        (ipapi.co and ipwho.is), causing the shopper to be silently shown
        USD prices. The `geoCurrencyFallbackMonitor` counts these events
        per hour and fires a Slack alert when the count exceeds the
        configured threshold.
      enum:
        - checkout_login_prompt_viewed
        - checkout_login_prompt_action
        - cart_viewed
        - checkout_started
        - payment_method_selected
        - order_placed
        - auth_social_failed
        - suggested_message_picked
        - upsell_tab_clicked
        - upsell_item_added
        - upsell_checkout_proceeded
        - signin_page_action
        - clerk_session_fallback
        - sms_notify_sent
        - sms_notify_failed
        - order_push_tapped
        - fx_rates_fallback
        - seo_entity_fetch_failed
        - web_vital
        - mobile_ttid
        - payment_error
        - geo_currency_fallback
    AnalyticsEventRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/AnalyticsEventName"
        surface:
          type: string
          description: |
            Where the event was emitted from. For the checkout login
            prompt this is "cart" (cart's Proceed to Checkout button) or
            "checkout-direct" (a signed-out shopper hitting /checkout).
            For purchase-funnel events, "cart" is the cart drawer,
            "cart-screen" is the standalone cart tab/page, and
            "checkout" covers checkout_started, payment_method_selected
            and order_placed.
          enum: [cart, checkout-direct, cart-screen, checkout, upsell_modal, upsell_cart]
        action:
          type: string
          description: |
            For checkout-login-prompt action events, which choice the
            shopper picked. For payment_method_selected and order_placed,
            the chosen payment method id. For suggested_message_picked,
            the suggested-messages catalog category id whose card was
            tapped (`general`, `love`, `birthday`, `graduation`,
            `getWellSoon`, `newBabyBorn`, `thankYou`, `sympathy`). We
            track category-only — not the message body — so we never log
            user-controlled strings or anything that could be mistaken
            for a card message.
          enum:
            - continue
            - google
            - apple
            - guest
            - dismissed
            - card
            - wallet
            - paypal
            - mamo
            - whish
            - western
            - network
            - provider
            - general
            - love
            - birthday
            - graduation
            - getWellSoon
            - newBabyBorn
            - thankYou
            - sympathy
            - recommended
            - single_balloons
            - balloon_bundles
            - chocolate
            - plants
            - bears
            - candles
            - LCP
            - INP
            - CLS
            - TTFB
            - FCP
            - home
            - product
            - brand
            - category
            - occasion
        platform:
          type: string
          enum: [ios, android, web, mobile_web, desktop_web]
          description: |
            The client platform that produced the event. For `web_vital`
            events the web app sends `mobile_web` or `desktop_web` (derived
            from `navigator.userAgentData` or a viewport-width heuristic)
            so the dashboard can show per-device-type sparklines. All other
            web events use `web`.
        appVersion:
          type: string
          description: Optional app/build version string for debugging.
        errorCode:
          type: string
          maxLength: 64
          description: |
            For `auth_social_failed` events: the native SDK error code
            (e.g. iOS `-61440` = errSecMissingEntitlement, Android
            `DEVELOPER_ERROR`). Bounded length so we can never log
            unbounded user-controlled strings — the value is sourced
            from the native SDK, not the shopper.
        productId:
          type: string
          maxLength: 64
          description: |
            For `upsell_item_added` events: the product id of the upsell
            item the shopper added. Sourced from the server-supplied
            catalog, not from user input.
        sessionId:
          type: string
          maxLength: 36
          description: |
            Client-generated session identifier (UUID v4). Created once
            per app launch / page load and attached to every event so
            upsell-add → order_placed attribution can be computed at the
            session level rather than the coarser (platform, day)
            co-occurrence level. Nullable — events from older clients
            that predate this field will have no session_id.
        state:
          type: string
          maxLength: 64
          description: |
            For `order_push_tapped` events: the order state string from
            the push notification payload (e.g. `out_for_delivery`,
            `delivered`). Sourced from the server-controlled push payload,
            not from user input.
        appOrderId:
          type: string
          maxLength: 64
          description: |
            For `order_push_tapped` events: the internal app_orders row id
            from the push notification payload.
        wcOrderId:
          type: string
          maxLength: 64
          description: |
            For `order_push_tapped` events: the WooCommerce order id from
            the push notification payload.
        metricValue:
          type: number
          format: float
          description: |
            For `web_vital` events: the raw metric value reported by the
            web-vitals library. Timing metrics (LCP, INP, TTFB, FCP) are
            in milliseconds. CLS is a unitless ratio. The metric name is
            carried in `action` (LCP, INP, CLS, TTFB, FCP). Values outside
            [0, 60000] are clamped server-side before storage.
      required:
        - name
    AnalyticsEventResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    OrderEventState:
      type: string
      enum: [confirmed, out_for_delivery, delivered, cancelled, refunded]
    LoyaltyTierKey:
      type: string
      enum: [new, regular, loyal, vip]
    LoyaltyTier:
