    FbMobileEventRequest:
      type: object
      properties:
        event:
          type: string
          enum:
            - ViewContent
            - AddToCart
            - InitiateCheckout
            - Purchase
          description: Standard Facebook Pixel event name.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code of the shopper's delivery location (e.g. "LB", "AE"). CY is a silent no-op.
        value:
          type: number
          description: Order or product value in the checkout currency.
        currency:
          type: string
          description: ISO 4217 currency code (e.g. "USD", "AED").
        contentIds:
          type: array
          items:
            type: string
          description: Product IDs associated with the event.
        contentName:
          type: string
          description: Human-readable product name for ViewContent events.
        email:
          type: string
          description: Shopper email to be SHA-256 hashed server-side before sending to CAPI.
        phone:
          type: string
          description: Shopper phone (E.164 or local) to be SHA-256 hashed server-side before sending to CAPI.
      required:
        - event
        - countryCode
    FbMobileEventResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    FbWebEventRequest:
      type: object
      properties:
        eventName:
          type: string
          enum:
            - PageView
            - ViewContent
            - AddToCart
            - InitiateCheckout
            - Purchase
          description: Standard Facebook Pixel event name.
        pixelId:
          type: string
          description: Facebook Pixel ID (non-secret, already present in the browser env). The server resolves the access token from this ID.
        eventId:
          type: string
          description: Optional deduplication event ID. The server generates a random one when absent.
        fbp:
          type: string
          description: Value of the _fbp browser cookie (or a locally generated fallback) used for browser-side deduplication.
        fbclid:
          type: string
          description: Facebook click ID from the URL query string, passed as fbc in user_data.
        sourceUrl:
          type: string
          description: Full page URL where the event was fired, forwarded as event_source_url.
        userData:
          type: object
          properties:
            em:
              type: string
              description: Shopper email to be SHA-256 hashed server-side before sending to CAPI.
            ph:
              type: string
              description: Shopper phone to be SHA-256 hashed server-side before sending to CAPI.
        value:
          type: number
          description: Order or product value in the checkout currency.
        currency:
          type: string
          description: ISO 4217 currency code (e.g. "USD", "AED").
        contentIds:
          type: array
          items:
            type: string
          description: Product IDs associated with the event.
        contentName:
          type: string
          description: Human-readable product name for ViewContent events.
        numItems:
          type: integer
          description: Number of items for cart/checkout events.
      required:
        - eventName
        - pixelId
    FbWebEventResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
