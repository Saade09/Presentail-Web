        points:
          type: integer
        reason:
          type: string
        source:
          type: string
        wcOrderId:
          type: integer
          nullable: true
        storeKey:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - points
        - reason
        - source
        - createdAt
    LoyaltyAdminCoupon:
      type: object
      properties:
        id:
          type: integer
        tier:
          type: string
        discountPercent:
          type: integer
        code:
          type: string
        wcCouponId:
          type: integer
          nullable: true
        storeKey:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tier
        - discountPercent
        - code
        - status
        - createdAt
        - updatedAt
    LoyaltyAdminResponse:
      type: object
      properties:
        ok:
          type: boolean
        customerId:
          type: integer
        summary:
          $ref: "#/components/schemas/LoyaltySummary"
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/LoyaltyLedgerEntry"
        coupons:
          type: array
          items:
            $ref: "#/components/schemas/LoyaltyAdminCoupon"
      required:
        - ok
        - customerId
        - summary
        - ledger
        - coupons
    PushOrderEventRequest:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/OrderEventState"
        appOrderId:
          type: string
          description: Internal Presentail order id (e.g. PR-123456).
        wcOrderId:
          type: integer
          description: WooCommerce order id. Either appOrderId or wcOrderId must be provided.
        title:
          type: string
          description: Optional override for the notification title.
        body:
          type: string
          description: Optional override for the notification body.
      required:
        - state
    PushOrderEventResponse:
      type: object
      properties:
        ok:
          type: boolean
        sent:
          type: integer
          description: Number of push notifications delivered.
        smsSent:
          type: integer
          description: Number of SMS/WhatsApp messages sent (0 when Twilio is not configured or the state is not in SMS_NOTIFY_STATES).
      required:
        - ok
        - sent
    LocalizedNames:
      type: object
      description: |
        Optional translations of a display name. Keys are lowercase
        ISO 639-1 language codes ("ar", "fr"). English is implicit in
        the parent's `name` field. Missing translations should fall
        back to `name`.
      properties:
        ar:
          type: string
        fr:
          type: string
    DeliveryTimeSlot:
      type: object
      properties:
        label:
          type: string
          description: Human-readable slot label (e.g. "Morning (9 AM – 12 PM)").
        cutoffHour:
          type: number
          description: Hour of day (0–23) after which this slot can no longer be booked for same-day delivery.
        extraFee:
          type: number
          description: Additional surcharge (USD) for booking this slot, e.g. a night-delivery fee.
      required:
        - label
        - cutoffHour
    DeliveryCity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        fee:
          type: number
          description: Delivery fee in the country's native currency.
        expressAvailable:
          type: boolean
          description: Whether express/same-day delivery is available for this city.
        expressDeliveryLabel:
          type: string
          description: Human-readable express delivery promise for this city (e.g. "Arrives in 90 minutes").
        sameDayCutoffHour:
          type: number
          description: Hour of day (0–23, local time) after which same-day delivery cannot be booked.
        timeSlots:
          type: array
          description: Available delivery time slots for this city. Empty array means slots are not yet configured.
          items:
            $ref: "#/components/schemas/DeliveryTimeSlot"
        localizedNames:
          $ref: "#/components/schemas/LocalizedNames"
      required:
        - id
        - name
        - isActive
    DeliveryCountry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        flag:
          type: string
          description: Flag emoji or icon for the country.
        currency:
          type: string
          description: ISO 4217 currency code used by default for this country.
        isActive:
          type: boolean
        cities:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryCity"
        preferredDefaultCityId:
          type: string
          description: Optional id of the city to highlight as the default.
        localizedNames:
          $ref: "#/components/schemas/LocalizedNames"
      required:
        - id
        - name
        - code
        - flag
        - currency
        - isActive
        - cities
    HomepageBannerMediaType:
      type: string
      enum: [image, video]
    HomepageBanner:
      type: object
