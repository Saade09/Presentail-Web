    AnalyticsEventRequest:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/AnalyticsEventName"
        surface:
          type: string
          description: |
            Where the event was emitted from. For the checkout login
            prompt this is "cart" (cart's Proceed to Checkout button) or
            "checkout-direct" (a signed-out shopper hitting /checkout).
            For purchase-funnel events, "cart" is the cart drawer,
            "cart-screen" is the standalone cart tab/page, and
            "checkout" covers checkout_started, payment_method_selected
            and order_placed.
          enum: [cart, checkout-direct, cart-screen, checkout, upsell_modal, upsell_cart]
        action:
          type: string
          description: |
            For checkout-login-prompt action events, which choice the
            shopper picked. For payment_method_selected and order_placed,
            the chosen payment method id. For suggested_message_picked,
            the suggested-messages catalog category id whose card was
            tapped (`general`, `love`, `birthday`, `graduation`,
            `getWellSoon`, `newBabyBorn`, `thankYou`, `sympathy`). We
            track category-only — not the message body — so we never log
            user-controlled strings or anything that could be mistaken
            for a card message.
          enum:
            - continue
            - google
            - apple
            - guest
            - dismissed
            - card
            - wallet
            - apple_pay
            - google_pay
            - paypal
            - mamo
            - whish
            - western
            - network
            - provider
            - general
            - love
            - birthday
            - graduation
            - getWellSoon
            - newBabyBorn
            - thankYou
            - sympathy
            - recommended
            - single_balloons
            - balloon_bundles
            - chocolate
            - plants
            - bears
            - candles
            - LCP
            - INP
            - CLS
            - TTFB
            - FCP
            - home
            - product
            - brand
            - category
            - occasion
            - namePassword
            - otp
        platform:
          type: string
          enum: [ios, android, web, mobile_web, desktop_web]
          description: |
            The client platform that produced the event. For `web_vital`
            events the web app sends `mobile_web` or `desktop_web` (derived
            from `navigator.userAgentData` or a viewport-width heuristic)
            so the dashboard can show per-device-type sparklines. All other
            web events use `web`.
        appVersion:
          type: string
          description: Optional app/build version string for debugging.
        errorCode:
          type: string
          maxLength: 64
          description: |
            For `auth_social_failed` events: the native SDK error code
            (e.g. iOS `-61440` = errSecMissingEntitlement, Android
            `DEVELOPER_ERROR`). For `payment_error` events that originate
            from a Stripe card confirmation: the Stripe error code returned
            by the SDK (e.g. `card_declined`, `insufficient_funds`,
            `incorrect_cvc`, `do_not_honor`). Bounded length so we can
            never log unbounded user-controlled strings — the value is
            sourced from the native/web SDK, not the shopper.
        productId:
          type: string
          maxLength: 64
          description: |
            For `upsell_item_added` events: the product id of the upsell
            item the shopper added. Sourced from the server-supplied
            catalog, not from user input.
        sessionId:
          type: string
          maxLength: 36
          description: |
            Client-generated session identifier (UUID v4). Created once
            per app launch / page load and attached to every event so
            upsell-add → order_placed attribution can be computed at the
            session level rather than the coarser (platform, day)
            co-occurrence level. Nullable — events from older clients
            that predate this field will have no session_id.
        state:
          type: string
          maxLength: 64
          description: |
            For `order_push_tapped` events: the order state string from
            the push notification payload (e.g. `out_for_delivery`,
            `delivered`). Sourced from the server-controlled push payload,
            not from user input.
        appOrderId:
          type: string
          maxLength: 64
          description: |
            For `order_push_tapped` events: the internal app_orders row id
            from the push notification payload.
        wcOrderId:
          type: string
          maxLength: 64
          description: |
            For `order_push_tapped` events: the WooCommerce order id from
            the push notification payload.
        metricValue:
          type: number
          format: float
          description: |
            For `web_vital` events: the raw metric value reported by the
            web-vitals library. Timing metrics (LCP, INP, TTFB, FCP) are
            in milliseconds. CLS is a unitless ratio. The metric name is
            carried in `action` (LCP, INP, CLS, TTFB, FCP). Values outside
            [0, 60000] are clamped server-side before storage.
        bannerId:
          type: string
          maxLength: 64
          description: |
            For `banner_clicked` events: the unique id of the banner the
            shopper clicked. Sourced from the OS banner response, not user
            input.
        linkKind:
          type: string
          maxLength: 32
          description: |
            For `banner_clicked` events: the structured link type
            (`category` or `occasion`) when the banner has a structured
            link. Null/absent for legacy `linkUrl`-only banners.
        linkSlug:
          type: string
          maxLength: 128
          description: |
            For `banner_clicked` events: the slug of the linked category
            or occasion (matches the structured link slug stored on the
            banner). Null/absent when `linkKind` is absent.
        linkUrl:
          type: string
          maxLength: 512
          description: |
            For `banner_clicked` events: the raw destination URL when the
            banner has a legacy `linkUrl` (internal path or external URL).
            Null/absent for structured-link banners where `linkKind` is
            set.
        recommendationPosition:
          type: integer
          minimum: 1
          description: |
            For `recommended_product_clicked` events: 1-based position of
            the clicked product in the recommendations row shown on the
            unavailable-in-city page.
      required:
        - name
