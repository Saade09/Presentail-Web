        discountPercent:
          type: integer
        code:
          type: string
        status:
          type: string
          enum: [active, used, replaced, failed]
        storeKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - tier
        - tierLabel
        - discountPercent
        - code
        - status
        - createdAt
    LoyaltySummary:
      type: object
      properties:
        points:
