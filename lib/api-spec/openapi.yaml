          nullable: true
          description: Points still needed to reach `nextTier`. Null when already at the top tier.
        coupons:
          type: array
          items:
            $ref: "#/components/schemas/LoyaltyCoupon"
      required:
        - points
        - tier
        - pointsToNext
        - coupons
    LoyaltyMeResponse:
      type: object
      properties:
        ok:
          type: boolean
        loyalty:
          $ref: "#/components/schemas/LoyaltySummary"
      required:
