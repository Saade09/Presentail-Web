kind = "web"
previewPath = "/"
title = "Presentail Web"
version = "1.0.0"
id = "artifacts/presentail-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24188

[services.development]
run = "pnpm --filter @workspace/presentail-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/presentail-web", "run", "build" ]
publicDir = "artifacts/presentail-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24188"
BASE_PATH = "/"
