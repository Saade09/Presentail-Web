kind = "web"
previewPath = "/"
title = "Presentail Web"
version = "1.0.0"
id = "artifacts/presentail-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24188

[services.development]
run = "pnpm --filter @workspace/presentail-web run dev"

[services.production]

[services.production.build]
# Run typecheck before building so that any TypeScript error aborts the deploy
# and keeps the previous version running (same pattern as the API server).
args = ["sh", "-c", "pnpm --filter @workspace/presentail-web run typecheck && pnpm --filter @workspace/presentail-web run build && pnpm --filter @workspace/presentail-web run verify-build"]

[services.production.run]
args = [ "node", "artifacts/presentail-web/serve.mjs" ]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "24188"
BASE_PATH = "/"
