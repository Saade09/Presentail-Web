kind = "mobile"
previewPath = "/app/"
title = "Presentail Mobile"
version = "1.0.0"
id = "artifacts/presentail"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/app/" ]
localPort = 20808

[services.development]
run = "pnpm --filter @workspace/presentail run dev"

[services.production]
run = [ "pnpm", "--filter", "@workspace/presentail", "run", "serve" ]

[services.production.build]
# Run typecheck before building so that any TypeScript error aborts the deploy
# and keeps the previous version running (same pattern as the web app).
args = ["sh", "-c", "pnpm --filter @workspace/presentail run typecheck && pnpm --filter @workspace/presentail run build"]

[services.env]
PORT = "20808"
BASE_PATH = "/app/"
