kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Run the DB schema migration before building so that:
# (a) the production database is always up to date before the new binary starts,
# (b) a failed migration aborts the deploy and keeps the previous server running.
# DATABASE_URL must be set as a Replit secret for the production environment.
# push-force is required because CI/build steps have no TTY for the interactive prompt.
args = ["sh", "-c", "pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
