kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/feeds"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Run the DB schema migration before building so that:
# (a) the production database is always up to date before the new binary starts,
# (b) a failed migration aborts the deploy and keeps the previous server running.
# DATABASE_URL must be set as a Replit secret for the production environment.
# push-force is required because CI/build steps have no TTY for the interactive prompt.
#
# After a successful build, scripts/post-deploy-seo-trigger.sh fires a GitHub
# repository_dispatch event (type: "production-deployed") so the SEO audit workflow
# runs automatically on every Replit publish — not just on git pushes that touch
# specific paths.  Requires two Replit secrets:
#   GITHUB_DISPATCH_TOKEN  — fine-grained PAT with actions:write scope (or classic
#                            PAT with repo scope) on this repository.
#   GITHUB_REPOSITORY      — owner/repo slug, e.g. presentail/presentail
# The dispatch call is non-fatal: if either secret is absent the build still succeeds.
args = ["sh", "-c", "pnpm --filter @workspace/api-server run release-build && (sh scripts/post-deploy-seo-trigger.sh || true)"]

[services.production.build.env]
NODE_ENV = "production"
API_RELEASE_STAGED = "1"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
