name: DB – Apply schema to production

# This is the deliberate pre-deploy gate for the API. It compiles and verifies
# the exact revision, stores its source maps as a protected Actions artifact,
# then applies the production schema under an advisory lock. Replit publishing
# must start only after this workflow succeeds for the same commit.
# Can also be triggered manually via "Run workflow" for emergency migrations or
# when the automatic trigger is bypassed (e.g. force-push, squash-merge).
#
# Mechanism: `drizzle-kit push --force` is used because CI has no TTY for the
# interactive destructive-change prompt. The `--force` flag is safe here because
# schema changes land on main only after code review; any destructive column/table
# drop must be explicitly authored and reviewed before reaching this step.
#
# Required secret:
#   PROD_DATABASE_URL — PostgreSQL connection string for the production database.
#   Set this in GitHub → Settings → Secrets and variables → Actions → New
#   repository secret. Scoped to the "production" environment when that
#   environment is configured (adds an optional manual-approval gate).
#
# Concurrency: only one migration can run at a time against production.
# A second push that arrives while a migration is in progress will wait, not
# cancel, because cancelling an in-flight schema push could leave the DB in a
# half-applied state.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_run:
        description: "Confirm you want to push the schema to production"
        required: true
        type: boolean
        default: false

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Push schema to production database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require manual migration confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.force_run != true
        run: |
          echo "Manual production migration was not confirmed; refusing to create a green gate."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore composite library outputs
        uses: actions/cache@v4
        with:
          path: |
            lib/*/dist
            lib/*/tsconfig.tsbuildinfo
          key: libs-v2-${{ runner.os }}-node24-${{ hashFiles('lib/**', 'tsconfig*.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Compile and verify API/schema compatibility
        run: |
          set +e
          started=$(date +%s%3N)
          pnpm --filter @workspace/api-server run release-build
          status=$?
          duration_ms=$(( $(date +%s%3N) - started ))
          echo "### API compatibility stage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: ${duration_ms} ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: $([ "$status" -eq 0 ] && echo passed || echo failed)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          NODE_ENV: production
          API_REQUIRE_MIGRATION_GATE: "0"

      - name: Store protected API source maps
        uses: actions/upload-artifact@v4
        with:
          name: api-source-maps-${{ github.sha }}
          path: artifacts/api-server/debug-source-maps/
          if-no-files-found: error
          retention-days: 30

      - name: Push schema to production database
        run: |
          set +e
          started=$(date +%s%3N)
          pnpm --filter @workspace/db run push-force-prod-locked
          status=$?
          duration_ms=$(( $(date +%s%3N) - started ))
          echo "### Production schema stage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: ${duration_ms} ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: $([ "$status" -eq 0 ] && echo passed || echo failed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cancellation: disabled" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
