name: iOS – Promote TestFlight build to App Store

# Manually-triggered workflow that promotes a TestFlight build to the public
# App Store. Supports two modes: "dry-run" (default) prepares the App Store
# version, attaches the build, writes the release notes, and prints the
# rendered notes per locale WITHOUT submitting for App Review; "submit"
# performs the same preparation and then submits for App Review. The
# recommended flow is to run "dry-run" first, eyeball the rendered notes
# in the job summary, then re-run with the same inputs in "submit" mode.
# We deliberately keep promotion manual so a human stays in the loop after
# TestFlight QA.
#
# Mechanism: a small Node script (`scripts/src/promoteToAppStore.ts`) that
# talks to the App Store Connect API directly. We chose this over `eas submit`
# (which targets TestFlight, not App Store version creation + review) and
# `fastlane deliver` (extra Ruby toolchain) because it adds zero new
# dependencies and produces clear, line-by-line failure messages.
#
# Inputs:
#   mode           – "dry-run" (default) prepares the App Store version,
#                    attaches the build, writes the release notes, and
#                    prints the rendered notes per locale, but does NOT
#                    submit for App Review. "submit" performs the same
#                    preparation and then submits for App Review.
#                    Recommended flow: run "dry-run" first, eyeball the
#                    rendered notes in the job summary, then re-run with
#                    the same inputs in "submit" mode.
#   build_number   – ASC build number to promote, or "latest" for the most
#                    recent VALID iOS build uploaded to TestFlight.
#   release_notes  – "What's New" text written to every existing localization
#                    on the new App Store version.
#
# Required secrets (already in use by ios-testflight.yml):
#   ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID, ASC_API_KEY_P8.
#   EXPO_TOKEN is unused here but kept available for parity with the
#   TestFlight workflow.
#
# To trigger: GitHub → Actions → "iOS – Promote TestFlight build to App Store"
# → Run workflow → fill inputs → Run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: dry-run (preview only) or submit (sends for App Review)"
        required: true
        type: choice
        default: "dry-run"
        options:
          - dry-run
          - submit
      build_number:
        description: 'TestFlight build number to promote (or "latest")'
        required: true
        default: "latest"
      release_notes:
        description: "What's New release notes (shown on the App Store)"
        required: true
        default: "TODO: replace with real release notes before submitting."

concurrency:
  group: ios-app-store
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote build to App Store review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Build web app (vite + compress-assets)
        # Required so the Brotli sidecars exist for the chunk budget check below.
        run: pnpm --filter @workspace/presentail-web run build

      - name: Chunk budget check (≤200 kB brotli per chunk)
        # Blocks the App Store promotion when any JS chunk exceeds the budget,
        # matching the gate that runs in the web-serve-check CI workflow and the
        # Android Play Store workflow.
        run: node artifacts/presentail-web/scripts/check-chunk-budget.mjs artifacts/presentail-web/dist/public

      - name: Run scripts tests
        run: pnpm --filter @workspace/scripts run test

      - name: Promote build to App Store
        run: pnpm --filter @workspace/scripts run promote-ios-to-app-store
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          PROMOTE_BUILD_NUMBER: ${{ inputs.build_number }}
          PROMOTE_RELEASE_NOTES: ${{ inputs.release_notes }}
          PROMOTE_MODE: ${{ inputs.mode }}

      # Once promotion succeeds, the marketing version we just submitted is
      # locked into App Review / Ready For Sale. The next TestFlight build
      # must therefore ship under a NEW marketing version, otherwise the
      # next promotion run will collide with this one. We bump the patch
      # version automatically and open a PR so a human still reviews/merges
      # it before the next iOS build goes out. Skip in dry-run mode since
      # nothing was actually submitted to App Review.
      - name: Bump expo.version (patch)
        id: bump
        if: inputs.mode == 'submit'
        run: pnpm --filter @workspace/scripts run bump-app-version

      - name: Open PR with version bump
        if: inputs.mode == 'submit'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ios): bump expo.version to ${{ steps.bump.outputs.next_version }} after App Store promotion"
          title: "chore(ios): bump expo.version to ${{ steps.bump.outputs.next_version }}"
          body: |
            Auto-generated by the `iOS – Promote TestFlight build to App Store` workflow.

            The previous version `${{ steps.bump.outputs.previous_version }}` was just submitted to App Review, so the next TestFlight build needs a new marketing version. This PR bumps `expo.version` in `artifacts/presentail/app.json` to `${{ steps.bump.outputs.next_version }}`.

            Merge this before kicking off the next iOS build.
          branch: chore/bump-expo-version-${{ steps.bump.outputs.next_version }}
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: artifacts/presentail/app.json
