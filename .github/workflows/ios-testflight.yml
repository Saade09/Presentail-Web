name: iOS – Build & Submit to TestFlight

on:
  push:
    branches: [main]
    # The post-build baseline refresh step opens a PR that touches only
    # `shipped-native-modules.json`. Negating that path here prevents
    # merging that PR from kicking off another full EAS production build
    # + TestFlight submission. Manual rebuilds remain possible via
    # workflow_dispatch.
    paths:
      - "artifacts/presentail/**"
      - "!artifacts/presentail/shipped-native-modules.json"
      - "lib/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: artifacts/presentail

concurrency:
  group: ios-testflight
  # Submission is a release operation; never cancel it after EAS has started.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-submit:
    name: EAS Build → TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Restore composite library outputs
        uses: actions/cache@v4
        with:
          path: |
            lib/*/dist
            lib/*/tsconfig.tsbuildinfo
          key: libs-v2-${{ runner.os }}-node20-${{ hashFiles('lib/**', 'tsconfig*.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Build shared libs
        run: pnpm run typecheck:libs
        working-directory: .

      - name: Run shipped-modules safety-check tests
        run: pnpm --filter @workspace/scripts run test
        working-directory: .

      - name: Check for unsafe new native modules
        run: pnpm --filter @workspace/scripts run check-presentail-native-modules
        working-directory: .

      - name: Run compress-assets fixture tests
        # Verifies that compress-assets.mjs correctly produces .br/.gz sidecars
        # and fails loudly when the assets directory is missing or empty.
        # Running this before the EAS build ensures a broken compression pipeline
        # is caught here rather than silently shipping under-compressed web assets.
        run: pnpm --filter @workspace/presentail-web run test
        working-directory: .

      - name: Run mobile tests
        run: pnpm --filter @workspace/presentail run test
        working-directory: .

      - name: Restore verified web build
        id: web-dist-cache
        uses: actions/cache@v4
        with:
          path: artifacts/presentail-web/dist
          key: web-dist-v3-${{ runner.os }}-node20-${{ hashFiles('artifacts/presentail-web/src/**', 'artifacts/presentail-web/public/**', '!artifacts/presentail-web/public/blog/*-480.webp', '!artifacts/presentail-web/public/blog/*-768.webp', 'artifacts/presentail-web/index.html', 'artifacts/presentail-web/package.json', 'artifacts/presentail-web/tsconfig.json', 'artifacts/presentail-web/vite.config.ts', 'artifacts/presentail-web/*.mjs', 'artifacts/presentail-web/scripts/generate-blog-hero-variants.mjs', 'artifacts/presentail-web/scripts/pageEligibility.mjs', 'lib/**', 'attached_assets/Elegant-dark-teal-stationery-design_1778742277420.avif', 'attached_assets/Presentail-Arabic-Logo*', 'attached_assets/Presentail_PNG-01*', 'scripts/build-artifact-provenance.mjs', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig*.json') }}

      - name: Build web app (vite + compress-assets)
        # Required so the Brotli sidecars exist for the chunk budget check below.
        if: steps.web-dist-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/presentail-web run build
        working-directory: .

      - name: Verify web provenance, integrity, and size budget
        run: pnpm --filter @workspace/presentail-web run verify-build
        working-directory: .

      - name: Chunk budget check (≤200 kB brotli per chunk)
        # Blocks the TestFlight submission when any JS chunk exceeds the budget,
        # matching the gate that runs in the web-serve-check CI workflow.
        run: node artifacts/presentail-web/scripts/check-chunk-budget.mjs artifacts/presentail-web/dist/public
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        run: echo '${{ secrets.ASC_API_KEY_P8 }}' > ./asc-api-key.p8

      - name: Verify required EAS project secrets
        # Checks that every secret whose absence silently breaks the shipped
        # binary is registered in the EAS project BEFORE the build starts.
        # EAS inlines missing secrets as empty strings, so the binary would
        # build successfully but fail at runtime (e.g. Stripe "invalid key",
        # Google sign-in refusing to open). Failing here saves build minutes
        # and surfaces a clear error instead of a broken TestFlight build.
        #
        # Secrets checked (all platforms):
        #   EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY – required for card payments
        #   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID   – required for Google sign-in
        # iOS-only:
        #   EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID   – required for native iOS sheet
        #
        # Note: app.config.js guards run the same checks server-side during the
        # EAS build as a backstop; this step fails faster (before the build
        # queue is consumed) and prints a single consolidated error message.
        run: |
          set -euo pipefail
          SECRETS_JSON=$(eas secret:list --json 2>/dev/null)
          MISSING=""
          for KEY in \
            EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID \
            EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID; do
            FOUND=$(echo "$SECRETS_JSON" | jq -r --arg k "$KEY" \
              'map(select(.name == $k)) | length')
            if [ "$FOUND" = "0" ]; then
              MISSING="$MISSING\n  - $KEY"
            fi
          done
          if [ -n "$MISSING" ]; then
            printf "ERROR: The following required EAS project secrets are missing:%b\n" \
              "$MISSING" >&2
            printf "EAS will inline an empty string for each missing secret, producing\n" >&2
            printf "a binary that appears to build successfully but fails at runtime.\n" >&2
            printf "Register each missing secret with:\n" >&2
            printf "  eas secret:create --scope project --name <KEY> --value <VALUE>\n" >&2
            exit 1
          fi
          echo "All required EAS secrets are present."

      - name: Build iOS and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_ASC_API_KEY_PATH: ./asc-api-key.p8
          EXPO_APPLE_TEAM_ID: 4DR9CS3387
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION

      # Ping search engines after a successful build so any new web content
      # that shipped alongside this release is indexed promptly.
      # Secrets used here (optional — script falls back to built-in defaults):
      #   SITEMAP_URL  – full URL of the sitemap; defaults to
      #                  https://presentail.com/sitemap.xml when unset.
      #   INDEXNOW_KEY – IndexNow API key; defaults to the built-in key
      #                  when unset.
      - name: Submit sitemap to search engines
        run: pnpm --filter @workspace/scripts run submit-sitemap
        working-directory: .
        env:
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      # The TestFlight binary that was just submitted contains the native
      # modules currently resolved in node_modules. Refresh the baseline
      # JSON the safety check reads so the next PR can re-baseline against
      # the build that actually shipped, instead of an older snapshot.
      - name: Refresh shipped-native-modules baseline
        run: pnpm --filter @workspace/scripts run write-presentail-native-modules
        working-directory: .

      - name: Open PR with refreshed shipped-native-modules baseline
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ios): refresh shipped-native-modules baseline after TestFlight build"
          title: "chore(ios): refresh shipped-native-modules baseline after TestFlight build"
          body: |
            Auto-generated by the `iOS – Build & Submit to TestFlight` workflow.

            The EAS production build that was just submitted to TestFlight contains the native modules currently resolved in `artifacts/presentail/node_modules`. This PR refreshes `artifacts/presentail/shipped-native-modules.json` to match that set so the `check-presentail-native-modules` safety check re-baselines against the binary that actually shipped.

            Merge once the new TestFlight build is live; if the diff is empty, this PR will not be opened.
          branch: chore/refresh-shipped-native-modules
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: artifacts/presentail/shipped-native-modules.json
