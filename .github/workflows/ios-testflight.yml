name: iOS – Build & Submit to TestFlight

on:
  push:
    branches: [main]
    paths:
      - "artifacts/presentail/**"
      - "lib/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: artifacts/presentail

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: EAS Build → TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Check for unsafe new native modules
        run: pnpm --filter @workspace/scripts run check-presentail-native-modules
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        run: echo '${{ secrets.ASC_API_KEY_P8 }}' > ./asc-api-key.p8

      - name: Build iOS and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
        env:
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_ASC_API_KEY_PATH: ./asc-api-key.p8
