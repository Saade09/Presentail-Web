name: Mobile type-check

on:
  push:
    branches: [main]
    paths:
      - "artifacts/presentail/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "artifacts/presentail/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-check.yml"

jobs:
  mobile-typecheck:
    name: Mobile app type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Type-check mobile app
        run: pnpm --filter @workspace/presentail run typecheck
