name: Upload credential scan

on:
  push:
    branches: [main]
    paths:
      - "attached_assets/**"
      - "upload/**"
      - "uploads/**"
      - "scratch/**"
      - "scratches/**"
      - "temp/**"
      - "tmp/**"
      - "**/upload/**"
      - "**/uploads/**"
      - "**/scratch/**"
      - "**/scratches/**"
      - "**/temp/**"
      - "**/tmp/**"
      - "scripts/src/checkUploadCredentials.ts"
      - "scripts/package.json"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/credential-scan.yml"
  pull_request:

jobs:
  scan-upload-credentials:
    name: Scan upload and scratch files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check upload and scratch files for credentials
        run: pnpm run check-upload-credentials