name: Configure branch protection

# Run this workflow manually (once, as a repo admin) to register the required
# status checks on the main branch.  It reads the existing protection settings
# first so it never clobbers rules that were already in place.
#
# Required permissions: the GITHUB_TOKEN in this workflow is granted
# `administration: write` so it can modify branch-protection rules.  GitHub
# Actions grants that scope automatically when the permission is declared
# below, as long as the runner has access (i.e. the triggering user is a repo
# admin or the org allows it).

on:
  workflow_dispatch:

permissions:
  administration: write

jobs:
  configure:
    name: Add required status checks to main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Add translation checks as required status checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BRANCH="main"

          # Required check names must match exactly what GitHub reports after a run.
          # Format: "<workflow name> / <job name>" where the workflow name comes
          # from the `name:` field at the top of check-translations.yml and the job
          # name from each job's `name:` field within that file.
          #
          # check-translations.yml (name: check-translations) defines five jobs:
          #   check-mobile-translations        → "Unused + missing + undefined translation keys (mobile)"
          #   check-web-translations           → "Unused + missing + undefined translation keys (web)"
          #   locale-dictionary-tests          → "Locale dictionary tests (web)"
          #   check-hardcoded-strings          → "Hardcoded English strings (web)"
          #   check-hardcoded-mobile-strings   → "Hardcoded English strings (mobile)"
          MOBILE_TRANSLATIONS="check-translations / Unused + missing + undefined translation keys (mobile)"
          WEB_TRANSLATIONS="check-translations / Unused + missing + undefined translation keys (web)"
          LOCALE_DICT_TESTS="check-translations / Locale dictionary tests (web)"
          HARDCODED_STRINGS="check-translations / Hardcoded English strings (web)"
          HARDCODED_MOBILE_STRINGS="check-translations / Hardcoded English strings (mobile)"

          # api-server-tests.yml (name: API server unit tests) defines one job:
          #   api-server-tests  → "API server unit tests"
          API_SERVER_TESTS="API server unit tests / API server unit tests"

          # api-server-check.yml (name: API server checks) defines one job:
          #   api-server-typecheck  → "API server type-check"
          API_SERVER_TYPECHECK="API server checks / API server type-check"

          # mobile-lint.yml (name: Mobile lint & typecheck) defines one job:
          #   mobile-lint  → "ESLint & tsc – mobile app"
          MOBILE_LINT="Mobile lint & typecheck / ESLint & tsc – mobile app"

          # mobile-check.yml (name: Mobile type-check) defines one job:
          #   mobile-typecheck  → "Mobile app type-check"
          MOBILE_TYPECHECK="Mobile type-check / Mobile app type-check"

          # web-check.yml (name: Web type-check) defines one job:
          #   web-typecheck  → "Web app type-check"
          WEB_TYPECHECK="Web type-check / Web app type-check"

          # web-lint.yml (name: Web lint) defines two jobs:
          #   web-lint  → "ESLint – web app"
          #   web-test  → "Unit tests – web app"
          WEB_LINT="Web lint / ESLint – web app"
          WEB_TEST="Web lint / Unit tests – web app"

          # web-serve-check.yml (name: Web serve checks) defines two jobs:
          #   web-serve-check  → "Build → serve → compression + sidecar-blocking checks"
          #   chunk-budget     → "Chunk budget (≤200 kB brotli per chunk)"
          # chunk-budget runs after web-serve-check (needs:) and downloads the dist
          # artifact so it can fail independently with a clear, targeted context string.
          WEB_SERVE_CHECK="Web serve checks / Build → serve → compression + sidecar-blocking checks"
          CHUNK_BUDGET="Web serve checks / Chunk budget (≤200 kB brotli per chunk)"

          # lib-typecheck.yml (name: Lib type-check) defines one job:
          #   lib-typecheck  → "Type-check all lib packages"
          LIB_TYPECHECK="Lib type-check / Type-check all lib packages"

          # codegen-check.yml (name: OpenAPI codegen check) defines one job:
          #   verify-codegen  → "Verify codegen is up to date"
          CODEGEN_CHECK="OpenAPI codegen check / Verify codegen is up to date"

          echo "Fetching current required-status-check config for ${BRANCH}…"

          # The endpoint returns 404 when branch protection is not yet configured.
          CURRENT=$(gh api "repos/${REPO}/branches/${BRANCH}/protection/required_status_checks" 2>/dev/null || echo '{}')

          STRICT=$(echo "$CURRENT" | jq -r '.strict // false')

          # Collect existing contexts and merge in all required checks.
          MERGED=$(echo "$CURRENT" | jq \
            --arg mobile          "$MOBILE_TRANSLATIONS" \
            --arg web             "$WEB_TRANSLATIONS" \
            --arg dict            "$LOCALE_DICT_TESTS" \
            --arg hc              "$HARDCODED_STRINGS" \
            --arg hcm             "$HARDCODED_MOBILE_STRINGS" \
            --arg api             "$API_SERVER_TESTS" \
            --arg tsc             "$API_SERVER_TYPECHECK" \
            --arg mobileLint      "$MOBILE_LINT" \
            --arg mobileTsc       "$MOBILE_TYPECHECK" \
            --arg webTsc          "$WEB_TYPECHECK" \
            --arg webLint         "$WEB_LINT" \
            --arg webTest         "$WEB_TEST" \
            --arg webServeCheck   "$WEB_SERVE_CHECK" \
            --arg chunkBudget     "$CHUNK_BUDGET" \
            --arg libTypecheck    "$LIB_TYPECHECK" \
            --arg codegenCheck    "$CODEGEN_CHECK" \
            '(.contexts // []) + [$mobile, $web, $dict, $hc, $hcm, $api, $tsc, $mobileLint, $mobileTsc, $webTsc, $webLint, $webTest, $webServeCheck, $chunkBudget, $libTypecheck, $codegenCheck] | unique')

          echo "Resulting required contexts:"
          echo "$MERGED" | jq -r '.[]'

          # PATCH updates only required_status_checks without touching other rules.
          PAYLOAD=$(jq -n \
            --argjson strict   "$STRICT" \
            --argjson contexts "$MERGED" \
            '{strict: $strict, contexts: $contexts}')

          gh api "repos/${REPO}/branches/${BRANCH}/protection/required_status_checks" \
            --method PATCH \
            --input - <<< "$PAYLOAD"

          echo "Done. All required status checks are now registered on ${BRANCH}."
