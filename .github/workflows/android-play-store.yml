name: Android – Build & Submit to Google Play

# Required secrets:
#   EXPO_TOKEN                  – Expo account token for EAS CLI authentication.
#   GOOGLE_SERVICE_ACCOUNT_KEY_JSON – Full JSON content of the Google service
#                                account key that has the "Release Manager" role
#                                on the Play Console. Written to
#                                ./google-service-account.json at build time,
#                                matching the path configured in eas.json's
#                                submit.production.android.serviceAccountKeyPath.
#
# Optional secrets (sitemap ping — script falls back to built-in defaults):
#   SITEMAP_URL  – full URL of the sitemap; defaults to
#                  https://presentail.com/sitemap.xml when unset.
#   INDEXNOW_KEY – IndexNow API key; defaults to the built-in key when unset.

on:
  push:
    branches: [main]
    # Exclude shipped-native-modules.json (consistent with ios-testflight.yml).
    # The post-build PR also bumps app.json, which matches the wildcard below;
    # the job-level `if` guard handles that re-trigger case for all merge
    # strategies (squash, rebase, and merge-commit).
    paths:
      - "artifacts/presentail/**"
      - "!artifacts/presentail/shipped-native-modules.json"
      - "lib/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: artifacts/presentail

concurrency:
  group: android-play-store
  # Submission is a release operation; never cancel it after EAS has started.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-submit:
    name: EAS Build → Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip when the commit that triggered this run is the auto-generated
    # versionCode bump. We check two patterns to cover all three GitHub merge
    # strategies:
    #   - Squash / rebase: head_commit.message starts with the bump message.
    #   - Merge commit:    head_commit.message is "Merge pull request … from
    #                      chore/bump-android-version-code-<N>", so the branch
    #                      name pattern appears in the message.
    # Either match is sufficient to prevent the bump PR merge from kicking
    # off another Play Store submission.
    if: |
      !startsWith(github.event.head_commit.message, 'chore(android): bump versionCode') &&
      !contains(github.event.head_commit.message, 'chore/bump-android-version-code-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Restore composite library outputs
        uses: actions/cache@v4
        with:
          path: |
            lib/*/dist
            lib/*/tsconfig.tsbuildinfo
          key: libs-v2-${{ runner.os }}-node20-${{ hashFiles('lib/**', 'tsconfig*.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Build shared libs
        run: pnpm run typecheck:libs
        working-directory: .

      - name: Run compress-assets fixture tests
        # Verifies that compress-assets.mjs correctly produces .br/.gz sidecars
        # and fails loudly when the assets directory is missing or empty.
        # Running this before the EAS build ensures a broken compression pipeline
        # is caught here rather than silently shipping under-compressed web assets.
        run: pnpm --filter @workspace/presentail-web run test
        working-directory: .

      - name: Run shipped-modules safety-check tests
        # Runs the unit tests for checkPresentailNativeModules.ts so a regression
        # in the safety-check script itself is caught before it reaches production.
        run: pnpm --filter @workspace/scripts run test
        working-directory: .

      - name: Check for unsafe new native modules
        run: pnpm --filter @workspace/scripts run check-presentail-native-modules
        working-directory: .

      - name: Run mobile tests
        run: pnpm --filter @workspace/presentail run test
        working-directory: .

      - name: Restore verified web build
        id: web-dist-cache
        uses: actions/cache@v4
        with:
          path: artifacts/presentail-web/dist
          key: web-dist-v2-${{ runner.os }}-node20-${{ hashFiles('artifacts/presentail-web/**', 'lib/**', 'attached_assets/**', 'scripts/build-artifact-provenance.mjs', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig*.json') }}

      - name: Build web app (vite + compress-assets)
        # Required so the Brotli sidecars exist for the chunk budget check below.
        if: steps.web-dist-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/presentail-web run build
        working-directory: .

      - name: Verify web provenance, integrity, and size budget
        run: pnpm --filter @workspace/presentail-web run verify-build
        working-directory: .

      - name: Chunk budget check (≤200 kB brotli per chunk)
        # Blocks the Play Store submission when any JS chunk exceeds the budget,
        # matching the gate that runs in the web-serve-check CI workflow.
        run: node artifacts/presentail-web/scripts/check-chunk-budget.mjs artifacts/presentail-web/dist/public
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}' > ./google-service-account.json

      - name: Verify required EAS project secrets
        # Checks that every secret whose absence silently breaks the shipped
        # binary is registered in the EAS project BEFORE the build starts.
        # EAS inlines missing secrets as empty strings, so the binary would
        # build successfully but fail at runtime (e.g. Stripe "invalid key",
        # Google sign-in refusing to open). Failing here saves build minutes
        # and surfaces a clear error instead of a broken Play Store binary.
        #
        # Secrets checked:
        #   EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY – required for card payments
        #   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID   – required for Google sign-in
        #     (Android exchanges it for an idToken; also used for the web client)
        #
        # EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID is intentionally omitted here
        # because Android does not use the iOS OAuth URL scheme.
        #
        # Note: app.config.js guards run the same checks server-side during the
        # EAS build as a backstop; this step fails faster (before the build
        # queue is consumed) and prints a single consolidated error message.
        run: |
          set -euo pipefail
          SECRETS_JSON=$(eas secret:list --json 2>/dev/null)
          MISSING=""
          for KEY in \
            EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            FOUND=$(echo "$SECRETS_JSON" | jq -r --arg k "$KEY" \
              'map(select(.name == $k)) | length')
            if [ "$FOUND" = "0" ]; then
              MISSING="$MISSING\n  - $KEY"
            fi
          done
          if [ -n "$MISSING" ]; then
            printf "ERROR: The following required EAS project secrets are missing:%b\n" \
              "$MISSING" >&2
            printf "EAS will inline an empty string for each missing secret, producing\n" >&2
            printf "a binary that appears to build successfully but fails at runtime.\n" >&2
            printf "Register each missing secret with:\n" >&2
            printf "  eas secret:create --scope project --name <KEY> --value <VALUE>\n" >&2
            exit 1
          fi
          echo "All required EAS secrets are present."

      - name: Build Android (EAS)
        # Build only – submission happens in a separate step after the integrity
        # check below so a missing or corrupt artifact is caught before it reaches
        # the Play Store. --json emits a JSON array describing the build(s) that
        # were queued/completed so we can capture the exact build ID and artifact
        # URL from this run rather than querying the most-recent-finished list.
        id: eas_build
        run: |
          set -euo pipefail
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --json 2>/dev/null)
          echo "build_json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BUILD_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Assert Android build artifact is ready
        # Verify that the specific EAS build queued in this run completed with a
        # downloadable artifact URL before allowing the submit step to run.
        # Exits non-zero (failing the workflow loudly) when the artifact URL is
        # absent, guarding against remote build failures that may exit 0 but
        # produce no AAB. Captures BUILD_ID for the targeted submit step below.
        id: assert_artifact
        run: |
          set -euo pipefail
          BUILD_JSON='${{ steps.eas_build.outputs.build_json }}'
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id // empty')
          ARTIFACT_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // empty')
          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: Could not parse a build ID from the EAS build output." >&2
            echo "Refusing to submit to Google Play." >&2
            exit 1
          fi
          if [ -z "$ARTIFACT_URL" ]; then
            echo "ERROR: Android build artifact URL is missing for build $BUILD_ID." >&2
            echo "The EAS build did not produce a downloadable AAB." >&2
            echo "Refusing to submit to Google Play." >&2
            exit 1
          fi
          echo "Android build artifact verified for build $BUILD_ID: $ARTIFACT_URL"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Submit Android to Google Play
        # Submit the specific build ID that passed the integrity check above,
        # not just the most-recent build, to prevent a stale artifact from
        # being submitted when this build failed to produce an AAB.
        run: eas submit --platform android --profile production --non-interactive --id ${{ steps.assert_artifact.outputs.build_id }}

      # Ping search engines after a successful Play Store submission so any new
      # web content that shipped alongside this release is indexed promptly.
      # Secrets used here (optional — script falls back to built-in defaults):
      #   SITEMAP_URL  – full URL of the sitemap; defaults to
      #                  https://presentail.com/sitemap.xml when unset.
      #   INDEXNOW_KEY – IndexNow API key; defaults to the built-in key
      #                  when unset.
      - name: Submit sitemap to search engines
        run: pnpm --filter @workspace/scripts run submit-sitemap
        working-directory: .
        env:
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      # The Android binary that was just submitted contains the native modules
      # currently resolved in node_modules. Refresh the baseline JSON so the
      # safety check re-baselines against what actually shipped.
      - name: Refresh shipped-native-modules baseline
        run: pnpm --filter @workspace/scripts run write-presentail-native-modules
        working-directory: .

      # After a successful Play Store submission the versionCode used in this
      # build is locked. The next submission must ship a higher versionCode.
      # We bump it automatically and open a PR (along with the refreshed
      # baseline) so a human reviews it before the next Android build goes out.
      - name: Bump expo.android.versionCode
        id: bump
        run: pnpm --filter @workspace/scripts run bump-android-version-code
        working-directory: .

      - name: Open PR with versionCode bump and refreshed baseline
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(android): bump versionCode to ${{ steps.bump.outputs.next_versionCode }} after Play Store submission"
          title: "chore(android): bump versionCode to ${{ steps.bump.outputs.next_versionCode }}"
          body: |
            Auto-generated by the `Android – Build & Submit to Google Play` workflow.

            The previous `versionCode` `${{ steps.bump.outputs.previous_versionCode }}` was just submitted to the Google Play production track, so the next build needs a higher `versionCode`. This PR bumps `expo.android.versionCode` in `artifacts/presentail/app.json` to `${{ steps.bump.outputs.next_versionCode }}` and refreshes `artifacts/presentail/shipped-native-modules.json` to reflect the native modules in the build that just shipped.

            Merge this before kicking off the next Android build.
          branch: chore/bump-android-version-code-${{ steps.bump.outputs.next_versionCode }}
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            artifacts/presentail/app.json
            artifacts/presentail/shipped-native-modules.json

  seo-audit:
    name: OG image audit (post-Play-Store-submit)
    needs: build-and-submit
    # The Play Store publish doesn't change the web/API, so a short settle time
    # is enough to confirm the current live state rather than waiting for a deploy.
    uses: ./.github/workflows/seo-audit-post-deploy.yml
    with:
      settle_seconds: 60
    secrets:
      PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
      PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
