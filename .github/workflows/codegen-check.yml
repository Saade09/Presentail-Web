name: OpenAPI codegen check

# Verifies that the Orval-generated files (React Query hooks and Zod schemas)
# are in sync with the OpenAPI spec.  If a PR edits the spec but forgets to
# re-run codegen, this job fails with a clear message so the author knows
# exactly what to fix.
#
# Trigger policy
# ──────────────
# pull_request: runs on EVERY PR, no path filter.
#   Rationale: generated files may have been committed stale in a prior PR.
#   A PR that touches only consumer code (e.g. artifacts/api-server) would not
#   trigger a path-filtered check, leaving drift undetected until something
#   breaks at runtime.  Running unconditionally on every PR is the only way to
#   guarantee the repo is always in a clean state when code merges to main.
#   The job is fast (pnpm install is cached; orval takes ~15 s) so the overhead
#   is acceptable.
#
# push to main: path-filtered.
#   Rationale: main is already clean after the PR gate above, so re-running on
#   every push to main would be redundant.  The path filter lets the job run
#   as a last-resort safety net when spec or generated files land directly on
#   main (e.g. automated bumps, merge commits after a force-push).

on:
  push:
    branches: [main]
    paths:
      - "lib/api-spec/openapi.yaml"
      - "lib/api-spec/orval.config.ts"
      - "lib/api-spec/package.json"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - ".github/workflows/codegen-check.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-codegen:
    name: Verify codegen is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Orval codegen
        # Run only the Orval step, not the full `codegen` script (which also
        # runs typecheck:libs and writes .tsbuildinfo / .d.ts files that are
        # not tracked here and would produce a spurious diff).
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts

      - name: Check for uncommitted changes in generated files
        run: |
          git diff --exit-code -- \
            lib/api-client-react/src/generated \
            lib/api-zod/src/generated \
            || {
              echo ""
              echo "╔══════════════════════════════════════════════════════════════╗"
              echo "║  OpenAPI codegen is out of sync with the spec.              ║"
              echo "║                                                              ║"
              echo "║  Run the following command and commit the result:            ║"
              echo "║    pnpm --filter @workspace/api-spec run codegen             ║"
              echo "╚══════════════════════════════════════════════════════════════╝"
              exit 1
            }
