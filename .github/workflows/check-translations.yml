name: check-translations

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/presentail/**"
      - "artifacts/presentail-web/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - "scripts/src/checkTranslations.ts"
      - "scripts/src/checkUnusedMobileTranslationKeys.ts"
      - "scripts/src/checkUnusedWebTranslationKeys.ts"
      - "scripts/src/checkHardcodedWebStrings.ts"
      - "scripts/src/checkHardcodedMobileStrings.ts"
      - "scripts/src/checkHardcodedApiStrings.ts"
      - "scripts/package.json"
      - ".github/workflows/check-translations.yml"
  pull_request:
    paths:
      - "artifacts/presentail/**"
      - "artifacts/presentail-web/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - "scripts/src/checkTranslations.ts"
      - "scripts/src/checkUnusedMobileTranslationKeys.ts"
      - "scripts/src/checkUnusedWebTranslationKeys.ts"
      - "scripts/src/checkHardcodedWebStrings.ts"
      - "scripts/src/checkHardcodedMobileStrings.ts"
      - "scripts/src/checkHardcodedApiStrings.ts"
      - "scripts/package.json"
      - ".github/workflows/check-translations.yml"
  # Smoke-test trigger: manually validate that the path-filter outputs are
  # correct for push-to-main scenarios (dorny/paths-filter behaves differently
  # on push vs pull_request — it compares against the previous commit rather
  # than the PR base).  Select which artifact to simulate as changed; all
  # downstream jobs obey the same "mobile"/"web"/"libs" outputs so you can
  # confirm that, e.g., choosing "libs-only" triggers both jobs even when no
  # artifact file changed.
  workflow_dispatch:
    inputs:
      simulate_changed:
        description: >
          Simulate which artifact changed.  Use "detect" to run the normal
          paths-filter against the HEAD commit (useful after a direct push to
          main); use "mobile-only", "web-only", "api-only", "libs-only", or
          "all" to force-enable the corresponding downstream jobs without
          relying on git diff.
        required: false
        default: detect
        type: choice
        options:
          - detect
          - mobile-only
          - web-only
          - api-only
          - libs-only
          - both
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Each output merges the real paths-filter result with the manual
      # override: exactly one of the two steps runs per invocation, so the
      # skipped step produces an empty string and the || falls through to the
      # step that did run.
      mobile: ${{ steps.filter.outputs.mobile || steps.override.outputs.mobile }}
      web: ${{ steps.filter.outputs.web || steps.override.outputs.web }}
      api: ${{ steps.filter.outputs.api || steps.override.outputs.api }}
      # libs is true when only shared-library files change (no artifact source
      # touched).  Downstream jobs OR this with their own artifact outputs so
      # a lib-only PR never silently skips the hardcoded-strings check.
      libs: ${{ steps.filter.outputs.libs || steps.override.outputs.libs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 gives dorny/paths-filter access to the previous
          # commit so it can diff HEAD against github.event.before on push
          # events.  With the default depth-1 shallow clone the base commit
          # is not present and the filter may mis-classify every file as
          # changed (or fail to resolve the base entirely).
          fetch-depth: 2

      - name: Detect which artifacts changed
        uses: dorny/paths-filter@v3
        id: filter
        # Skip on workflow_dispatch when the caller has chosen an explicit
        # simulation — the override step below sets the outputs instead.
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.simulate_changed == 'detect'
        with:
          filters: |
            mobile:
              - 'artifacts/presentail/**'
              - 'artifacts/presentail/app/**/*.tsx'
              - 'artifacts/presentail/src/**/*.tsx'
              - 'scripts/src/checkTranslations.ts'
              - 'scripts/src/checkUnusedMobileTranslationKeys.ts'
              - 'scripts/src/checkHardcodedMobileStrings.ts'
              - 'scripts/package.json'
              - '.github/workflows/check-translations.yml'
            web:
              - 'artifacts/presentail-web/**'
              - 'artifacts/presentail-web/src/**/*.tsx'
              - 'scripts/src/checkTranslations.ts'
              - 'scripts/src/checkUnusedWebTranslationKeys.ts'
              - 'scripts/src/checkHardcodedWebStrings.ts'
              - 'scripts/package.json'
              - '.github/workflows/check-translations.yml'
            api:
              - 'artifacts/api-server/**'
              - 'artifacts/api-server/src/**/*.ts'
              - 'scripts/src/checkTranslations.ts'
              - 'scripts/src/checkHardcodedApiStrings.ts'
              - 'scripts/package.json'
              - '.github/workflows/check-translations.yml'
            libs:
              - 'lib/**'
              - 'scripts/src/checkTranslations.ts'
              - 'scripts/src/checkHardcodedMobileStrings.ts'
              - 'scripts/src/checkHardcodedWebStrings.ts'
              - 'scripts/src/checkHardcodedApiStrings.ts'
              - 'scripts/package.json'
              - '.github/workflows/check-translations.yml'

      - name: Override filter outputs for smoke-test
        id: override
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.simulate_changed != 'detect'
        run: |
          sim="${{ github.event.inputs.simulate_changed }}"
          mobile=false
          web=false
          api=false
          libs=false
          case "$sim" in
            mobile-only) mobile=true ;;
            web-only)    web=true ;;
            api-only)    api=true ;;
            libs-only)   libs=true ;;
            both)        mobile=true; web=true ;;
            all)         mobile=true; web=true; api=true; libs=true ;;
          esac
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "web=$web"       >> "$GITHUB_OUTPUT"
          echo "api=$api"       >> "$GITHUB_OUTPUT"
          echo "libs=$libs"     >> "$GITHUB_OUTPUT"
          echo "Smoke-test: simulate_changed=$sim → mobile=$mobile web=$web api=$api libs=$libs"

  locale-dictionary-tests:
    name: Locale dictionary tests (web)
    needs: changes
    if: >
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.libs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run locale dictionary tests (web)
        id: locale-tests
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/presentail-web run test \
            > locale-dictionary-test-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment with locale dictionary test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TESTS_OUTCOME: ${{ steps.locale-tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- locale-dictionary-tests-bot -->';
            const passed = process.env.TESTS_OUTCOME === 'success';

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Locale dictionary tests passed',
                '',
                'All web locale dictionary unit tests are green.',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            } else {
              const raw = fs.readFileSync('locale-dictionary-test-output.txt', 'utf8').trim();
              body = [
                MARKER,
                '## ❌ Locale dictionary tests failed',
                '',
                'The following locale dictionary test failures must be fixed before merging:',
                '',
                '```',
                raw,
                '```',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if locale dictionary tests failed
        if: steps.locale-tests.outcome == 'failure'
        run: |
          echo "Locale dictionary tests failed — see output above and the PR comment for details."
          exit 1

  check-translations:
    name: Unified translation check (mobile + web + API)
    needs: changes
    if: >
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.libs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests for translation checker logic
        run: pnpm --filter @workspace/scripts run test

      - name: Run unified translation check
        id: check
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/scripts run check-translations \
            2>&1 | tee check-translations-output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Post or update PR comment with translation check results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- check-translations-bot -->';
            const passed = process.env.CHECK_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let output = '';
            try { output = fs.readFileSync('check-translations-output.txt', 'utf8').trim(); } catch {}
            const MAX = 30000;
            if (output.length > MAX) {
              output = output.slice(0, MAX) + '\n…(truncated — see full log at the link below)';
            }

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Translation checks passed',
                '',
                'All translation checks passed (unused keys · missing locales · hardcoded strings — mobile, web & API).',
                '',
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].join('\n');
            } else {
              body = [
                MARKER,
                '## ❌ Translation checks failed',
                '',
                'One or more translation checks failed. Fix the issues below before merging.',
                '',
                '<details>',
                '<summary>Check output</summary>',
                '',
                '```',
                output,
                '```',
                '',
                '</details>',
                '',
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if translation checks failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "Translation checks failed — see output above and the PR comment for details."
          exit 1
