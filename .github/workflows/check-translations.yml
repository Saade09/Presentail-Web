name: check-translations

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/presentail/**"
      - "artifacts/presentail-web/**"
      - "scripts/src/checkUnusedMobileTranslationKeys.ts"
      - "scripts/src/checkUnusedWebTranslationKeys.ts"
      - "scripts/src/checkHardcodedWebStrings.ts"
      - "scripts/package.json"
  pull_request:

jobs:
  locale-dictionary-tests:
    name: Locale dictionary tests (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run locale dictionary tests (web)
        id: locale-tests
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/presentail-web run test \
            > locale-dictionary-test-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment with locale dictionary test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TESTS_OUTCOME: ${{ steps.locale-tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- locale-dictionary-tests-bot -->';
            const passed = process.env.TESTS_OUTCOME === 'success';

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Locale dictionary tests passed',
                '',
                'All web locale dictionary unit tests are green.',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            } else {
              const raw = fs.readFileSync('locale-dictionary-test-output.txt', 'utf8').trim();
              body = [
                MARKER,
                '## ❌ Locale dictionary tests failed',
                '',
                'The following locale dictionary test failures must be fixed before merging:',
                '',
                '```',
                raw,
                '```',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if locale dictionary tests failed
        if: steps.locale-tests.outcome == 'failure'
        run: |
          echo "Locale dictionary tests failed — see output above and the PR comment for details."
          exit 1

  check-translations:
    name: Unused + missing + undefined translation keys (mobile & web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests for translation checker logic
        run: pnpm --filter @workspace/scripts run test

      - name: Check for unused, missing, and undefined translation keys (mobile + web)
        id: check
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/scripts run check-translations \
            2> translation-check-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment with translation check results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- translation-check-bot -->';
            const passed = process.env.CHECK_OUTCOME === 'success';

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Translation check passed',
                '',
                'All translation keys are present and accounted for.',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            } else {
              const raw = fs.readFileSync('translation-check-output.txt', 'utf8').trim();
              body = [
                MARKER,
                '## ❌ Translation check failed',
                '',
                'The following translation issues must be fixed before merging:',
                '',
                '```',
                raw,
                '```',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if translation check failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "Translation check failed — see output above and the PR comment for details."
          exit 1

      - name: Check for hardcoded English strings in web TSX
        run: pnpm --filter @workspace/scripts run check-hardcoded-web-strings
