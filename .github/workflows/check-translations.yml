name: check-translations

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/presentail/**"
      - "artifacts/presentail-web/**"
      - "scripts/src/checkUnusedMobileTranslationKeys.ts"
      - "scripts/src/checkUnusedWebTranslationKeys.ts"
      - "scripts/src/checkHardcodedWebStrings.ts"
      - "scripts/package.json"
      - ".github/workflows/check-translations.yml"
  pull_request:
    paths:
      - "artifacts/presentail/**"
      - "artifacts/presentail-web/**"
      - "scripts/src/checkUnusedMobileTranslationKeys.ts"
      - "scripts/src/checkUnusedWebTranslationKeys.ts"
      - "scripts/src/checkHardcodedWebStrings.ts"
      - "scripts/package.json"
      - ".github/workflows/check-translations.yml"
  # Smoke-test trigger: manually validate that the path-filter outputs are
  # correct for push-to-main scenarios (dorny/paths-filter behaves differently
  # on push vs pull_request — it compares against the previous commit rather
  # than the PR base).  Select which artifact to simulate as changed; all
  # downstream jobs obey the same "mobile"/"web" outputs so you can confirm
  # that, e.g., choosing "mobile-only" skips every web job and vice-versa.
  workflow_dispatch:
    inputs:
      simulate_changed:
        description: >
          Simulate which artifact changed.  Use "detect" to run the normal
          paths-filter against the HEAD commit (useful after a direct push to
          main); use "mobile-only", "web-only", or "both" to force-enable the
          corresponding downstream jobs without relying on git diff.
        required: false
        default: detect
        type: choice
        options:
          - detect
          - mobile-only
          - web-only
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Each output merges the real paths-filter result with the manual
      # override: exactly one of the two steps runs per invocation, so the
      # skipped step produces an empty string and the || falls through to the
      # step that did run.
      mobile: ${{ steps.filter.outputs.mobile || steps.override.outputs.mobile }}
      web: ${{ steps.filter.outputs.web || steps.override.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 gives dorny/paths-filter access to the previous
          # commit so it can diff HEAD against github.event.before on push
          # events.  With the default depth-1 shallow clone the base commit
          # is not present and the filter may mis-classify every file as
          # changed (or fail to resolve the base entirely).
          fetch-depth: 2

      - name: Detect which artifacts changed
        uses: dorny/paths-filter@v3
        id: filter
        # Skip on workflow_dispatch when the caller has chosen an explicit
        # simulation — the override step below sets the outputs instead.
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.simulate_changed == 'detect'
        with:
          filters: |
            mobile:
              - 'artifacts/presentail/**'
              - 'scripts/src/checkUnusedMobileTranslationKeys.ts'
              - 'scripts/package.json'
              - '.github/workflows/check-translations.yml'
            web:
              - 'artifacts/presentail-web/**'
              - 'scripts/src/checkUnusedWebTranslationKeys.ts'
              - 'scripts/src/checkHardcodedWebStrings.ts'
              - 'scripts/package.json'
              - '.github/workflows/check-translations.yml'

      - name: Override filter outputs for smoke-test
        id: override
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.simulate_changed != 'detect'
        run: |
          sim="${{ github.event.inputs.simulate_changed }}"
          mobile=false
          web=false
          case "$sim" in
            mobile-only) mobile=true ;;
            web-only)    web=true ;;
            both)        mobile=true; web=true ;;
          esac
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "web=$web"    >> "$GITHUB_OUTPUT"
          echo "Smoke-test: simulate_changed=$sim → mobile=$mobile web=$web"

  locale-dictionary-tests:
    name: Locale dictionary tests (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run locale dictionary tests (web)
        id: locale-tests
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @workspace/presentail-web run test \
            > locale-dictionary-test-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment with locale dictionary test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TESTS_OUTCOME: ${{ steps.locale-tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- locale-dictionary-tests-bot -->';
            const passed = process.env.TESTS_OUTCOME === 'success';

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Locale dictionary tests passed',
                '',
                'All web locale dictionary unit tests are green.',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            } else {
              const raw = fs.readFileSync('locale-dictionary-test-output.txt', 'utf8').trim();
              body = [
                MARKER,
                '## ❌ Locale dictionary tests failed',
                '',
                'The following locale dictionary test failures must be fixed before merging:',
                '',
                '```',
                raw,
                '```',
                '',
                `_Updated by the [check-translations](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow._`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if locale dictionary tests failed
        if: steps.locale-tests.outcome == 'failure'
        run: |
          echo "Locale dictionary tests failed — see output above and the PR comment for details."
          exit 1

  check-mobile-translations:
    name: Unused + missing + undefined translation keys (mobile)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests for translation checker logic
        run: pnpm --filter @workspace/scripts run test

      - name: Check for unused, missing, and undefined translation keys (mobile)
        id: check
        continue-on-error: true
        env:
          MOBILE_TRANSLATION_JSON_OUT: ${{ github.workspace }}/mobile-translation-results.json
        run: |
          set +e
          pnpm --filter @workspace/scripts run check-unused-mobile-translations
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Post or update PR comment with mobile translation check results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- mobile-translation-check-bot -->';
            const passed = process.env.CHECK_OUTCOME === 'success';

            function readJson(filePath) {
              try { return JSON.parse(fs.readFileSync(filePath, 'utf8')); }
              catch { return null; }
            }

            function details(summary, body) {
              return `<details>\n<summary>${summary}</summary>\n\n${body}\n\n</details>\n`;
            }

            function keyList(keys) {
              return keys.map(k => `- \`${k}\``).join('\n');
            }

            function buildMobileSection(data) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (!data) return '### 📱 Mobile — ⚠️ results file missing\n\nThe mobile translation check may have failed before writing its results. Check the [workflow log](' + runUrl + ') for details.\n';
              if (data.passed) return '### 📱 Mobile — ✅ all checks passed\n';
              const c = data.checks;
              const parts = [`### 📱 Mobile — ❌ issues found\n`];

              if (c.unusedKeys?.length) {
                parts.push(details(
                  `🗑️ Unused keys (${c.unusedKeys.length})`,
                  keyList(c.unusedKeys) +
                    '\n\n_Remove these from all locale blocks (EN, AR, FR) in `artifacts/presentail/lib/translations.ts`._'
                ));
              }
              for (const { locale, keys } of (c.missingLocale ?? [])) {
                parts.push(details(
                  `🌍 Missing ${locale} translations (${keys.length})`,
                  keyList(keys) +
                    `\n\n_Add these to the ${locale} locale block in \`artifacts/presentail/lib/translations.ts\`._`
                ));
              }
              if (c.undefinedRefs?.length) {
                const lines = c.undefinedRefs.flatMap(({ key, sites }) => [
                  `- \`${key}\``,
                  ...sites.map(({ file, line }) => `  - \`${file}:${line}\``),
                ]);
                parts.push(details(
                  `❓ Undefined key references (${c.undefinedRefs.length})`,
                  lines.join('\n') +
                    '\n\n_Add these keys to all three locale blocks or fix the call sites._'
                ));
              }
              for (const { locale, keys } of (c.orphanKeys ?? [])) {
                parts.push(details(
                  `🗑️ Orphan ${locale} keys (${keys.length})`,
                  keyList(keys) +
                    `\n\n_These exist in ${locale} but not in EN — remove or add to EN._`
                ));
              }
              const placeholdersByLocale = {};
              for (const hit of (c.placeholders ?? [])) {
                (placeholdersByLocale[hit.locale] ??= []).push(hit);
              }
              for (const [locale, hits] of Object.entries(placeholdersByLocale)) {
                const lines = hits.map(h =>
                  h.reason === 'identical_to_en'
                    ? `- \`${h.key}\` — value is identical to EN`
                    : `- \`${h.key}\` — no Arabic-script characters found`
                );
                parts.push(details(
                  `📋 Placeholder ${locale} translations (${hits.length})`,
                  lines.join('\n') + '\n\n_Replace with real translations._'
                ));
              }
              return parts.join('\n');
            }

            const mobile = readJson('mobile-translation-results.json');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Mobile translation check passed',
                '',
                'All mobile translation keys are present and accounted for.',
                '',
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].join('\n');
            } else {
              body = [
                MARKER,
                '## ❌ Mobile translation check failed',
                '',
                'The following translation issues must be fixed before merging.',
                '',
                buildMobileSection(mobile),
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].filter(s => s !== undefined).join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if mobile translation check failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "Mobile translation check failed — see output above and the PR comment for details."
          exit 1

  check-web-translations:
    name: Unused + missing + undefined translation keys (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests for translation checker logic
        run: pnpm --filter @workspace/scripts run test

      - name: Check for unused, missing, and undefined translation keys (web)
        id: check
        continue-on-error: true
        env:
          WEB_TRANSLATION_JSON_OUT: ${{ github.workspace }}/web-translation-results.json
        run: |
          set +e
          pnpm --filter @workspace/scripts run check-unused-web-translations
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Post or update PR comment with web translation check results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- web-translation-check-bot -->';
            const passed = process.env.CHECK_OUTCOME === 'success';

            function readJson(filePath) {
              try { return JSON.parse(fs.readFileSync(filePath, 'utf8')); }
              catch { return null; }
            }

            function details(summary, body) {
              return `<details>\n<summary>${summary}</summary>\n\n${body}\n\n</details>\n`;
            }

            function keyList(keys) {
              return keys.map(k => `- \`${k}\``).join('\n');
            }

            function buildWebSection(data) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (!data) return '### 🌐 Web — ⚠️ results file missing\n\nThe web translation check may have failed before writing its results. Check the [workflow log](' + runUrl + ') for details.\n';
              if (data.passed) return '### 🌐 Web — ✅ all checks passed\n';
              const c = data.checks;
              const parts = [`### 🌐 Web — ❌ issues found\n`];

              if (c.unusedKeys?.length) {
                parts.push(details(
                  `🗑️ Unused keys (${c.unusedKeys.length})`,
                  keyList(c.unusedKeys) +
                    '\n\n_Remove these from the appropriate locale domain file in `artifacts/presentail-web/src/locales/`._'
                ));
              }
              if (c.missingFr?.length) {
                const total = c.missingFr.reduce((s, f) => s + f.keys.length, 0);
                const body = c.missingFr.map(({ file, keys }) =>
                  `**\`${file}\`**\n${keyList(keys)}`
                ).join('\n\n') +
                  '\n\n_Add these to the corresponding `*StringsFr` export._';
                parts.push(details(`🇫🇷 Missing French translations (${total})`, body));
              }
              if (c.orphanedFr?.length) {
                parts.push(details(
                  `🗑️ Orphaned French-only keys (${c.orphanedFr.length})`,
                  keyList(c.orphanedFr) +
                    '\n\n_Remove these or add matching base entries in `*Strings`._'
                ));
              }
              if (c.undefinedRefs?.length) {
                const lines = c.undefinedRefs.flatMap(({ key, sites }) => [
                  `- \`${key}\``,
                  ...sites.map(({ file, line }) => `  - \`${file}:${line}\``),
                ]);
                parts.push(details(
                  `❓ Undefined key references (${c.undefinedRefs.length})`,
                  lines.join('\n') +
                    '\n\n_Add these keys (with both `en` and `ar` values) to the appropriate `*Strings` export._'
                ));
              }
              if (c.missingAr?.length) {
                const total = c.missingAr.reduce((s, f) => s + f.keys.length, 0);
                const body = c.missingAr.map(({ file, keys }) =>
                  `**\`${file}\`**\n${keyList(keys)}`
                ).join('\n\n') +
                  '\n\n_Add an `ar` field to each Dict entry in the locale file._';
                parts.push(details(`🇸🇦 Missing Arabic field (${total})`, body));
              }
              if (c.emptyValues?.length) {
                const total = c.emptyValues.reduce((s, f) => s + f.entries.length, 0);
                const body = c.emptyValues.map(({ file, entries }) =>
                  `**\`${file}\`**\n` +
                  entries.map(({ key, fields }) => `- \`${key}\` (empty: ${fields.join(', ')})`).join('\n')
                ).join('\n\n') +
                  '\n\n_Fill in the empty values in the locale file._';
                parts.push(details(`⬜ Empty translation values (${total})`, body));
              }
              return parts.join('\n');
            }

            const web = readJson('web-translation-results.json');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Web translation check passed',
                '',
                'All web translation keys are present and accounted for.',
                '',
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].join('\n');
            } else {
              body = [
                MARKER,
                '## ❌ Web translation check failed',
                '',
                'The following translation issues must be fixed before merging.',
                '',
                buildWebSection(web),
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].filter(s => s !== undefined).join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if web translation check failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "Web translation check failed — see output above and the PR comment for details."
          exit 1

  check-hardcoded-strings:
    name: Hardcoded English strings (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for hardcoded English strings in web TSX
        id: check
        continue-on-error: true
        env:
          HARDCODED_STRINGS_JSON_OUT: ${{ github.workspace }}/hardcoded-strings-results.json
        run: |
          set +e
          pnpm --filter @workspace/scripts run check-hardcoded-web-strings
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Post or update PR comment with hardcoded-strings check results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- hardcoded-strings-check-bot -->';
            const passed = process.env.CHECK_OUTCOME === 'success';

            function readJson(filePath) {
              try { return JSON.parse(fs.readFileSync(filePath, 'utf8')); }
              catch { return null; }
            }

            function details(summary, body) {
              return `<details>\n<summary>${summary}</summary>\n\n${body}\n\n</details>\n`;
            }

            function kindLabel(hit) {
              if (hit.kind === 'jsx-text') return 'JSX text';
              if (hit.kind === 'jsx-prop') return `prop: ${hit.attr}`;
              if (hit.kind === 'fallback-string') return '?? fallback';
              return 'standalone';
            }

            function buildSection(data) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (!data) return '⚠️ Results file missing — the check may have failed before writing its output. Check the [workflow log](' + runUrl + ') for details.\n';
              if (data.passed) return null;

              const parts = [];
              for (const { file, hits } of data.byFile) {
                const lines = hits.map(h =>
                  `- line ${h.line} \`[${kindLabel(h)}]\` — "${h.text}"`
                ).join('\n');
                parts.push(details(
                  `\`${file}\` (${hits.length} hit${hits.length === 1 ? '' : 's'})`,
                  lines
                ));
              }
              return parts.join('\n');
            }

            const data = readJson('hardcoded-strings-results.json');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (passed) {
              body = [
                MARKER,
                '## ✅ Hardcoded-strings check passed',
                '',
                'No hardcoded English strings detected in web TSX files.',
                '',
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].join('\n');
            } else {
              const section = buildSection(data);
              const hitCount = data?.hitCount ?? '?';
              const fileCount = data?.fileCount ?? '?';
              body = [
                MARKER,
                '## ❌ Hardcoded strings detected',
                '',
                `Found **${hitCount}** likely-hardcoded English string${hitCount === 1 ? '' : 's'} across **${fileCount}** file${fileCount === 1 ? '' : 's'}.`,
                'Wrap each string in a `t()` call (add the key to `src/locales/`) or include it in a `const COPY: Record<Language, Copy>` object.',
                'False positives can be suppressed with a trailing `// i18n-ignore` comment.',
                '',
                section,
                `_Updated by the [check-translations](${runUrl}) workflow._`,
              ].filter(s => s != null).join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (!passed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if hardcoded-strings check failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "Hardcoded-strings check failed — see output above and the PR comment for details."
          exit 1
