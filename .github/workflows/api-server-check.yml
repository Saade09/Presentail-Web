name: API server checks

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/**"
      - ".github/workflows/api-server-check.yml"
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/**"
      - ".github/workflows/api-server-check.yml"

jobs:
  api-server-typecheck:
    name: API server type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared libs
        run: pnpm run typecheck:libs

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Lint API server
        run: pnpm --filter @workspace/api-server run lint
